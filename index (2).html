<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Banco de Questões — Anatomia e Análises Clínicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--h:215;--aS:68%;--aL:40%;--bS:80%;--bL:95%;--cS:70%;--cL:97%;--lS:55%;--lL:84%;--onacc:#fff;--onsol:#fff;
--oa:#ef5f0d;--ob:#fff0e6;--oc:#fff7f1;--od:#f6cdb0;--link:#2a8fe6;--chipbg:#e8e8e8;--qhead:#f1f1f1;--qnum:#8d949e;--tbbg:#f4f4f4;--tbline:#dcdcdc;--tbhov:#e8e8e8;
--bg:#efefef;--card:#fff;--ink:#27364f;--mute:#6c7480;--line:#dcdcdc;--nav:#fff;--navink:#27364f;--navmute:#6c7480;
--ok:#1a8a49;--okbg:#e6f6ec;--okink:#0e4727;--bad:#cc3a3a;--badbg:#fdecec;--badink:#7a1b1b;
--yel:#fff6d6;--yelline:#e6cb6c;--grn:#e7f7ec;--grnline:#9bd4ae;--sh:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05)}
:root[data-theme="dark"]{--bg:#141414;--card:#1e1e1e;--ink:#ececec;--mute:#a3a3a3;--line:#343434;--nav:#0e0e0e;--navink:#fff;--navmute:#b0b0b0;--oa:#ff8a47;--ob:#3a2616;--oc:#241b13;--od:#6a4528;--link:#6db6ff;--chipbg:#2c2c2c;--qhead:#262626;--qnum:#555b66;--tbbg:rgba(255,255,255,.07);--tbline:rgba(255,255,255,.18);--tbhov:rgba(255,255,255,.16);--onacc:#1a0e05;--onsol:#08101c;
--ok:#4cc17e;--okbg:#10301f;--okink:#bdf0d1;--bad:#ff7a7a;--badbg:#3a1618;--badink:#ffd0d0;--yel:#3a3217;--yelline:#8a7632;--grn:#12301f;--grnline:#2f7a50;--sh:none;color-scheme:dark}
body,.tab,.seg button{--acc:var(--oa);--acc2:var(--ob);--blue:var(--oc);--blueline:var(--od)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Segoe UI Symbol","Noto Sans Symbols 2",sans-serif;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
svg.ic{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
/* ---------- barra superior ---------- */
.nav{position:sticky;top:0;z-index:60;background:var(--nav);color:var(--navink);border-top:5px solid var(--oa);border-bottom:1px solid var(--line)}
.nav-in{max-width:1220px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0;margin-right:auto}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#ff8a3d,var(--oa));display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:22px;height:22px}
.brand h1{margin:0;font-size:1.06rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.brand p{margin:1px 0 0;font-size:.74rem;color:var(--navmute);line-height:1.3}
.seg{display:flex;gap:2px;order:3;width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--navmute);padding:9px 14px 8px;font-weight:700;font-size:.92rem;white-space:nowrap;margin-bottom:-9px}
.seg button:hover{color:var(--navink)}
.seg button.on{color:var(--navink);border-bottom-color:var(--oa)}
.tools{display:flex;gap:6px;align-items:center}
.tbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--tbline);background:var(--tbbg);color:var(--navink);display:grid;place-items:center;font-weight:700;font-size:.82rem}
.tbtn:hover{background:var(--tbhov)}
/* ---------- layout ---------- */
.wrap{max-width:1220px;margin:0 auto;padding:14px 16px 90px;display:block}
.side h3{margin:0 0 8px;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700}
.tabs{position:sticky;top:58px;z-index:40;background:var(--bg);margin:0 -16px 12px;padding:8px 16px;border-bottom:1px solid var(--line)}
.side-h{display:none}
.tabs-in{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px 6px 7px;font-size:.86rem;font-weight:600;white-space:nowrap;max-width:240px;text-align:left}
.tab b{display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;background:var(--chipbg);color:var(--ink);border-radius:99px;padding:0 5px;font-size:.74rem;font-weight:800}
.tab .tt{overflow:hidden;text-overflow:ellipsis}
.tab .pct{margin-left:auto;font-size:.72rem;color:var(--mute);font-weight:700}
.tab.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.tab.on b{background:rgba(255,255,255,.3);color:var(--onacc)}
.tab:hover{border-color:var(--oa)}
.tab.on .pct{color:var(--onacc);opacity:.85}
/* ---------- painel (modo / estatísticas) ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:14px;border-top:4px solid var(--acc)}
.panel h2{margin:0;font-size:1rem;font-weight:800;line-height:1.3}
.panel .sub{margin:4px 0 0;color:var(--mute);font-size:.86rem}
.counts{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.cnt{font-size:.76rem;background:var(--bg);color:var(--ink);border:1px solid var(--blueline);border-radius:7px;padding:2px 8px;font-weight:600}
.modes{display:flex;gap:7px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.modes::-webkit-scrollbar{display:none}
.mode{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-size:.84rem;font-weight:600;white-space:nowrap;color:var(--mute)}
.mode:hover{border-color:var(--acc);color:var(--ink)}
.mode.on{border-color:var(--acc);background:var(--acc);color:var(--onacc)}
.stats{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--mute);align-items:center}
.stats b{color:var(--ink)}
.bar{flex:1 1 140px;height:7px;border-radius:99px;background:var(--line);overflow:hidden;min-width:110px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.mini{border:0;background:transparent;color:var(--link);text-decoration:underline;font-size:.78rem;padding:0}
details.more{margin-top:6px}details.more summary{cursor:pointer;color:var(--link);font-size:.82rem;font-weight:700}
/* ---------- cartão da questão ---------- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
.qhead{display:flex;align-items:stretch;background:var(--qhead);border-bottom:1px solid var(--line)}
.qnum{flex:none;min-width:54px;display:grid;place-items:center;background:var(--qnum);color:#fff;font-weight:800;font-size:.95rem;padding:0 10px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0;padding:9px 13px;font-size:.8rem;color:var(--mute);font-weight:500;min-width:0}
.crumbs span{display:inline-flex;align-items:center}
.crumbs span+span::before{content:"";width:5px;height:5px;border-right:1.6px solid var(--mute);border-top:1.6px solid var(--mute);transform:rotate(45deg);margin:0 9px 0 6px;opacity:.7}
.crumbs span:last-child{color:var(--ink);font-weight:700}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--mute)}
.qmeta b{color:var(--ink);font-weight:700}
.chip{font-size:.7rem;border-radius:99px;padding:2px 9px;border:1px solid var(--line);color:var(--mute);font-weight:700;background:var(--bg);white-space:nowrap}
.chip.b{border-color:var(--od);background:var(--ob);color:var(--ink)}
.chip.y{border-color:var(--yelline);background:var(--yel);color:var(--ink)}
.chip.p{border-color:var(--blueline);background:var(--blue);color:var(--ink)}
.chip.c{border-color:var(--yelline);background:var(--yel);color:var(--ink)}
.chip.g{border-color:var(--grnline);background:var(--grn);color:var(--ink)}
.qbody{padding:16px 16px 6px}
.stem{font-size:1.04rem;font-weight:500;white-space:pre-line;margin:0 0 14px;line-height:1.6}
ol.items{margin:0 0 14px;padding:0;list-style:none;display:grid;gap:7px}
ol.items li{display:flex;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
ol.items li b{flex:0 0 2.1em;color:var(--acc)}
.opts{display:grid;gap:8px;margin-bottom:6px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;min-height:50px}
.opt .l{flex:0 0 1.85em;height:1.85em;border-radius:50%;border:2px solid var(--acc);color:var(--acc);font-weight:800;display:grid;place-items:center;font-size:.8rem;margin-top:1px;background:var(--card)}
.opt .t{flex:1;overflow-wrap:anywhere;font-size:.97rem}
@media(hover:hover){.opt:not(:disabled):hover{border-color:var(--acc);background:var(--oc)}}
.opt.sel{border-color:var(--acc);background:var(--acc2);box-shadow:inset 3px 0 0 var(--acc)}
.opt.sel .l{background:var(--acc);color:var(--onacc)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--okink);box-shadow:inset 3px 0 0 var(--ok)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--onsol)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--badink);box-shadow:inset 3px 0 0 var(--bad)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--onsol)}
.opt.dim{opacity:.6}
.actrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 16px 16px}
.btn{border:0;background:var(--acc);color:var(--onacc);border-radius:9px;padding:11px 22px;font-weight:700;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--acc2);color:var(--ink)}
.btn.ok{background:var(--ok);color:var(--onsol)}.btn.mid{background:#c58a00;color:#fff}.btn.bad{background:var(--bad);color:var(--onsol)}
.hint{font-size:.8rem;color:var(--mute)}
.banner{margin:4px 16px 0;padding:11px 14px;border-radius:10px;font-weight:700;display:flex;gap:9px;align-items:center}
.banner.ok{background:var(--okbg);color:var(--okink);border:1px solid var(--ok)}
.banner.bad{background:var(--badbg);color:var(--badink);border:1px solid var(--bad)}
.banner.mid{background:var(--yel);border:1px solid var(--yelline)}
.res{margin:12px 16px 0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px}
.res[hidden]{display:none}
.res h4{margin:0 0 6px;font-size:.92rem;font-weight:800}
.res ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.res li{padding:8px 11px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:.92rem;overflow-wrap:anywhere}
.res li.t{border-left:4px solid var(--ok)}
.res li.f{border-left:4px solid var(--bad)}
.res li em{display:block;color:var(--mute);font-style:normal;margin-top:2px;font-size:.87rem}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:800;border-radius:5px;padding:1px 7px;margin-right:6px;color:var(--onsol);background:var(--ok);vertical-align:1px}
.tag.f{background:var(--bad)}
.tag svg.ic{width:.95em;height:.95em;stroke-width:3}
textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit}
textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.row .grow{flex:1 1 150px}
.cp{display:grid;gap:7px;margin:8px 0 0}
.cp label{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.cp input{margin-top:4px;width:18px;height:18px;accent-color:var(--ok)}
.model{white-space:pre-line}
.qbar{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:14px;background:var(--bg)}
.qbar button{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;padding:13px 8px;font-size:.84rem;font-weight:600;color:var(--mute);border-right:1px solid var(--line)}
.qbar button:last-child{border-right:0}
.qbar button:hover:not(:disabled){color:var(--link);background:var(--bg)}
.qbar button:disabled{opacity:.45;cursor:not-allowed}
.qbar button span.sh{display:none}
.qbar button.on{color:var(--link)}
.qstat{margin:0;padding:11px 16px;border-top:1px solid var(--line);font-size:.86rem;color:var(--mute);background:var(--bg)}
.qstat b{color:var(--ink)}
.donepill{align-self:center;margin:0 12px 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--blueline);border-radius:99px;padding:3px 11px 3px 8px;font-size:.76rem;font-weight:700;white-space:nowrap;color:var(--ink)}
.donepill svg.ic{color:var(--ok);width:1.25em;height:1.25em}
.donepill.bad svg.ic{color:var(--bad)}.donepill.mid svg.ic{color:#c58a00}
.empty{padding:34px 16px;text-align:center;color:var(--mute)}
.small{font-size:.78rem;color:var(--mute);margin-top:18px;text-align:center}
figure.fig{margin:0 0 12px;overflow-x:auto;text-align:center}
figure.fig img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
figure.fig img.zoom{max-width:none;width:920px;cursor:zoom-out}
figure.fig figcaption{font-size:.8rem;color:var(--mute);margin-top:4px;text-align:left}
.figbox{margin:0 0 12px}
.tw{overflow-x:auto;margin:0 0 12px}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem;background:var(--card)}
table.tbl caption{caption-side:top;text-align:left;font-weight:700;padding:0 0 6px;color:var(--ink)}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.tbl th{background:var(--acc2);color:var(--ink)}
.obs{margin:10px 0 0;padding:9px 12px;border-radius:9px;background:var(--yel);border:1px solid var(--yelline);font-size:.88rem;white-space:pre-line}
/* ---------- mobile pequeno ---------- */
@media(max-width:520px){.brand p{display:none}.qbody{padding:14px 13px 4px}.actrow{padding:6px 13px 14px}.banner{margin:4px 13px 0}.res{margin:12px 13px 0}.qbar button{font-size:.78rem;gap:5px;padding:12px 4px}.qbar button span.lb{display:none}.qbar button span.sh{display:inline}.donepill{margin:6px 10px 6px auto;padding:3px 9px 3px 6px;font-size:.72rem}.qhead.hasdone{flex-wrap:wrap}.qhead.hasdone .crumbs{flex:1 1 60%}.btn{flex:1 1 100%}}
/* ---------- computador: barra lateral ---------- */
@media(min-width:960px){
  .nav-in{flex-wrap:nowrap}
  .seg{order:0;width:auto;margin:0 6px}
  .seg button{margin-bottom:-9px;padding:13px 16px 12px}
  .brand{margin-right:0}.tools{margin-left:auto}
  .wrap{display:grid;grid-template-columns:318px minmax(0,1fr);gap:22px;align-items:start;padding-top:20px}
  .side{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;padding-right:2px;scrollbar-width:thin}
  .side-h{display:block}
  .tabs{position:static;margin:0 0 14px;padding:0;border:0;background:transparent}
  .tabs-in{flex-direction:column;overflow:visible;gap:5px}
  .tab{width:100%;max-width:none;border-radius:10px;padding:8px 11px 8px 8px;background:var(--card);border:1px solid var(--line);white-space:normal;font-weight:600;font-size:.88rem}
  .tab:hover{border-color:var(--acc)}
  .tab .tt{overflow:visible;text-overflow:clip;line-height:1.3}
  .tab.on{background:var(--acc);border-color:var(--acc)}
  .modes{flex-wrap:wrap;overflow:visible}
  .stem{font-size:1.08rem}
  .qbody{padding:20px 22px 6px}.actrow{padding:6px 22px 20px}.banner{margin:4px 22px 0}.res{margin:12px 22px 0}
}
</style>
</head>

<header class="nav">
  <div class="nav-in">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5 6 7.5 9 4"/><path d="M12 6h8"/><path d="M4 12.5 6 14.5 9 11"/><path d="M12 13h8"/><path d="M4 19.5 6 21.5 9 18"/><path d="M12 20h5"/></svg></div>
      <div><h1>Banco de Questões</h1><p id="tot"></p></div>
    </div>
    <div class="seg" id="subj" role="tablist" aria-label="Disciplina"></div>

  </div>
</header>
<div class="wrap">

  </aside>
  <main>
    <section class="qcard" id="qcard" aria-live="polite"></section>
    <p class="small">Sem login. Seu progresso fica salvo apenas neste navegador. Atalhos: A–E ou 1–5 escolhem a alternativa, V/F nas questões de julgar, Enter responde e avança, seta ← volta à questão anterior.</p>
  </main>
</div>
<script>
(function(){
"use strict";
/* ================= DSL / BANCO ================= */
var DB={anat:{name:"Anatomia",blocks:[]},cli:{name:"Análises Clínicas",blocks:[]},prova:{name:"Prova",blocks:[]}};
var SUBJ=["anat","cli","prova"];
var curB=null;
function B(s,id,t,st){curB={subj:s,id:id,title:t,sub:st||"",mc:[],o:[],S:[],P:[],ex:[]};DB[s].blocks.push(curB);}
function MC(b,stem){var r=[].slice.call(arguments,2),meta={};var last=r[r.length-1];if(last&&!Array.isArray(last))meta=r.pop();
  curB.mc.push({stem:stem,opts:r.map(function(o,i){return{t:o[0],why:o[1]||"",ok:i===0}}),meta:meta});}
function S(b,topic,rows){curB.S.push({topic:topic,rows:rows});}
function P(b,title,tpl,pairs,o){curB.P.push({title:title,tpl:tpl,pairs:pairs,extra:(o&&o.extra)||[]});}
function Q(b,label,stem,opts,ci,meta){curB.ex.push({label:label,stem:stem,open:false,opts:opts.map(function(o,i){return{t:o[0],why:o[1]||"",ok:i===ci};}),meta:meta||{}});}
function OX(b,label,stem,ans,cps,meta){curB.ex.push({label:label,stem:stem,open:true,ans:ans,cps:cps||[],meta:meta||{}});}
function O(b,stem,ans,cps,meta){curB.o.push({stem:stem,ans:ans,cps:cps||[],meta:meta||{}});}
B("anat",1,"Sistema Linfático","Capilares, coletores, linfonodos, troncos, ductos, baço e órgãos linfoides");

/* ---------- MÚLTIPLA ESCOLHA (a 1ª alternativa é a correta; o site embaralha) ---------- */
MC(1,"Os principais vasos linfáticos do corpo humano são o ducto linfático direito e o ducto torácico. Sobre sua drenagem, é correto afirmar:",
["O ducto linfático direito deságua na veia subclávia direita (ângulo venoso D) e o ducto torácico na veia subclávia esquerda (ângulo venoso E).","Os ductos terminam no ângulo venoso, onde a linfa volta ao sangue."],
["O ducto linfático direito deságua na veia cava inferior e o torácico na veia cava superior.","Os ductos não desembocam diretamente nas veias cavas; terminam nas veias do pescoço."],
["Ambos os ductos linfáticos deságuam na veia cava superior.","Pula a etapa: a linfa entra no ângulo venoso; só depois o sangue chega à cava superior."],

MC(1,"Sobre os tipos de vasos linfáticos, assinale a alternativa correta:",
["Os coletores têm três túnicas (íntima, média com músculo liso e adventícia) e várias válvulas verdadeiras ao longo do trajeto.","Coletor = condução; é comparado às veias."],
["Os capilares linfáticos têm músculo liso bem desenvolvido e várias válvulas verdadeiras.","Capilar tem só uma camada endotelial, sem músculo liso; suas ‘válvulas’ são junções em botão."],
["Os pré-coletores têm a camada muscular mais desenvolvida de todo o sistema e grande quantidade de válvulas verdadeiras.","Pré-coletor é transição: músculo liso ausente ou pouco desenvolvido."],
["Os troncos linfáticos são os vasos que devolvem a linfa diretamente às veias do pescoço.","Quem devolve ao sangue são os DUCTOS; os troncos apenas convergem para eles."],{s:"P"});

MC(1,"O que diferencia as ‘junções em botão’ dos capilares linfáticos das válvulas verdadeiras dos coletores?",
["As junções em botão ficam na interface do capilar, abrem pela pressão de FORA (interstício) e servem à captação; as válvulas verdadeiras ficam dentro do lúmen, abrem pela diferença de pressão DENTRO do vaso e impedem refluxo.","Entrada × condução unidirecional."],
["As junções em botão impedem o refluxo da linfa nos coletores; as válvulas verdadeiras captam o líquido do interstício.","Está invertido."],

["As junções em botão são exclusivas dos troncos e as válvulas verdadeiras exclusivas dos capilares.","Nenhuma das duas afirmações procede."],{s:"T"});

MC(1,"Um linfonodo é visto em corte. A linfa percorre, em ordem, qual trajeto interno?",

["Vaso eferente → seio medular → seios trabeculares → seio marginal → vasos aferentes.","Sentido inverso ao do fluxo."],
["Vasos aferentes → seio medular → seios trabeculares → seio marginal → eferente.","Trocou a ordem dos seios: o marginal vem primeiro, o medular por último."],
["Vasos aferentes → seio marginal → seio medular → seios trabeculares → eferente.","Os seios trabeculares vêm antes do medular."],{s:"P"});

MC(1,"Sobre a anatomia do linfonodo, assinale a correta:",
["Vários vasos aferentes chegam pela face convexa; normalmente um único eferente sai pelo hilo, na face côncava.","Muitos entram, um (em geral) sai."],
["Um único aferente entra pelo hilo e vários eferentes saem pela face convexa.","Invertido."],
["O hilo é onde entram os vasos aferentes.","Aferentes perfuram a cápsula pela face convexa; o hilo é a saída do eferente e passagem de vasos sanguíneos."],
["O paracórtex é rico em linfócitos B organizados em folículos.","Folículos de linfócitos B estão no CÓRTEX; no paracórtex predominam linfócitos T."],{s:"T"});

MC(1,"Paciente de 70 kg com edema nos membros inferiores. Segundo a aula, o acúmulo de líquido no interstício pode decorrer de:",
["Dificuldade no retorno venoso, sobrecarga/alteração da drenagem linfática, ou ambos.","Linfáticos acompanham as veias; problema em um sistema pode reter líquido nos tecidos."],

MC(1,"A linfa normal é descrita como:",

MC(1,"A cisterna do quilo recebe linfa de quais troncos e é a origem de qual estrutura?",

MC(1,"O ducto linfático direito drena qual território?",

["A maior parte do corpo, incluindo membros inferiores, pelve e abdome.","Esse é o território do ducto torácico."],
["Apenas o membro superior esquerdo.","Lado errado e território incompleto."],
["Somente os órgãos abdominais.","Abdome → tronco intestinal → cisterna do quilo → torácico."],{s:"A"});

MC(1,"Por que a professora destacou o ‘ângulo venoso’?",

["É a junção entre as veias cavas superior e inferior no átrio direito.","Não tem relação com o sistema linfático."],

["É a região onde a cisterna do quilo se forma, no abdome.","A cisterna é abdominal; o ângulo venoso é cervical."],{s:"T"});

MC(1,"Sobre órgãos linfoides, assinale a correta:",
["Medula óssea vermelha e timo são órgãos linfoides primários; linfonodos, baço e tonsilas são secundários.","Primários: formação/maturação; secundários: encontro com o antígeno."],
["Timo e baço são primários; linfonodos e medula óssea são secundários.","O baço é secundário e a medula óssea é primária."],
["O linfonodo é o filtro do sangue e o baço, o filtro da linfa.","É o inverso: linfonodo filtra linfa; baço filtra sangue."],
["Tonsilas são órgãos linfoides primários.","São secundárias."],{s:"A",c:1});

MC(1,"O anel tonsilar (de Waldeyer) é formado por:",
["Tonsila faríngea (adenoide), tonsilas tubárias, tonsilas palatinas e tonsila lingual.","Tecido linfoide em torno da entrada da faringe; função de defesa."],
["Tonsilas palatinas, timo, baço e linfonodos cervicais.","Timo e baço não fazem parte do anel."],

["Linfonodos axilares e inguinais.","Não pertencem ao anel."],{s:"A",c:1});

MC(1,"Sobre o transporte da linfa, qual afirmação é mais completa?",
["A linfa é movida por válvulas e músculo liso dos coletores, contração dos músculos esqueléticos vizinhos, pulsação de artérias próximas e movimentos respiratórios.","Dizer ‘só válvula e músculo liso’ seria incompleto."],
["A linfa é bombeada ativamente pelo coração, como o sangue.","A linfa tem baixa pressão e fluxo lento."],

["Somente a gravidade, por isso os linfáticos só drenam de cima para baixo.","Não procede."],{s:"A",c:1});

MC(1,"Um capilar linfático e um capilar sanguíneo diferem porque:",
["O linfático começa em fundo cego (como dedo de luva), é um pouco mais calibroso e tem parede de uma camada endotelial com junções em botão; o sanguíneo integra um circuito fechado artéria → capilar → veia.","Prova antiga: ‘fundo cego’ e comparação dos capilares."],
["O linfático faz parte de um circuito fechado e o sanguíneo começa em fundo cego.","Invertido."],
["O capilar linfático é fenestrado e possui músculo liso.","Não: parede só endotelial."],
["Ambos têm filamentos de ancoragem.","Filamentos de ancoragem são do capilar linfático."],{s:"A"});

S(1,"Capilares, pré-coletores e coletores",[
["O capilar linfático tem parede de uma única camada de células endoteliais.","O capilar linfático tem parede de três túnicas, com músculo liso desenvolvido.","Capilar = só endotélio (captação)."],
["As junções em botão dos capilares funcionam como ‘válvulas falsas’ de entrada.","As junções em botão são válvulas verdadeiras que impedem o refluxo no lúmen.","Entrada de líquido, proteínas, células e microrganismos."],
["Os filamentos de ancoragem puxam as ‘portinhas’ do capilar quando a pressão do interstício sobe.","Os filamentos de ancoragem fecham as junções quando a pressão do interstício sobe.","Pressão alta fora → tensiona filamentos → abre junções."],
["O pré-coletor é um vaso de transição, com músculo liso ausente ou pouco desenvolvido.","O pré-coletor tem a camada muscular mais desenvolvida do sistema linfático.","A camada muscular mais desenvolvida é a do coletor."],
["O coletor possui três túnicas: íntima, média (músculo liso) e adventícia.","O coletor possui apenas uma camada endotelial.","Coletor se parece com veia."],
["Linfonodos no trajeto ajudam a reconhecer um coletor.","Linfonodos são encontrados ao longo dos capilares linfáticos.","Os linfonodos ficam principalmente ao longo dos coletores."],
["O capilar linfático começa em fundo cego.","O capilar linfático é um circuito fechado que liga artéria a veia.","Circuito fechado é característica do sistema sanguíneo."],
["A linfa se forma a partir do líquido intersticial captado pelos capilares linfáticos.","A linfa se forma a partir da filtração do sangue nos rins.","Interstício → capilar linfático → linfa."],
["O fluxo de linfa é de cerca de 2 a 3 litros por dia.","O fluxo de linfa é de cerca de 20 litros por dia.","~120 mL/h."],
["Os capilares sanguíneos ‘vazam’ líquido para o interstício; parte volta para as veias e parte entra nos linfáticos.","Todo o líquido que sai dos capilares sanguíneos retorna pelas veias; os linfáticos não recolhem nada.","Os linfáticos são o ‘ralo’ da sobra."]
]);
S(1,"Linfonodos, troncos e ductos",[
["O linfonodo é um órgão linfoide secundário em forma de feijão, com cerca de 0,5 a 2 cm.","O linfonodo é um órgão linfoide primário com cerca de 20 cm.","Há ~500 pelo corpo."],
["Os vasos aferentes entram pela face convexa do linfonodo.","Os vasos aferentes entram pelo hilo, na face côncava.","Hilo = saída do eferente."],
["O seio marginal (subcapsular) é o primeiro seio percorrido pela linfa dentro do linfonodo.","O seio medular é o primeiro seio percorrido pela linfa dentro do linfonodo.","O medular é o último."],
["No córtex do linfonodo há linfócitos B em folículos.","No córtex do linfonodo predominam linfócitos T.","T → paracórtex."],
["O folículo secundário apresenta centro germinativo.","O folículo primário apresenta centro germinativo.","Primário = sem centro germinativo."],
["O tronco jugular drena cabeça e pescoço.","O tronco jugular drena membros inferiores.","MMII: troncos lombares."],
["Os troncos lombares drenam órgãos pélvicos e membros inferiores.","Os troncos lombares drenam apenas a cabeça.","Lombares → cisterna do quilo."],
["O ducto torácico se origina na cisterna do quilo.","O ducto linfático direito se origina na cisterna do quilo.","Quem nasce na cisterna é o torácico."],
["O ducto torácico sobe pelo tórax posterior, posteriormente ao diafragma.","O ducto torácico passa anteriormente ao coração.","Trajeto posterior."],
["O ducto linfático direito drena o quadrante superior direito do corpo.","O ducto linfático direito drena a maior parte do corpo.","Quem drena a maior parte é o torácico."],
["O ducto torácico termina no ângulo venoso esquerdo (subclávia E + jugular interna E).","O ducto torácico termina na veia cava inferior.","Ductos terminam em veias do pescoço."],
["A cisterna do quilo funciona como reservatório temporário da linfa vinda de baixo.","A cisterna do quilo fica no tórax, junto ao arco aórtico.","Dilatação na região inferior do abdome."],
["Lipídios absorvidos no intestino chegam ao sangue via vaso linfático central (lacteal) e linfa (quilo).","Lipídios absorvidos no intestino entram nos capilares sanguíneos da vilosidade, como a glicose.","Carboidratos/proteínas → capilar sanguíneo; lipídios → lacteal."]

S(1,"Órgãos linfoides, baço e anel tonsilar",[

O(1,"Descreva o caminho da linfa desde o interstício até voltar ao sangue, citando o que acontece em cada tipo de vaso.",
"O excesso de líquido no interstício aumenta a pressão por fora dos capilares linfáticos; os filamentos de ancoragem abrem as junções em botão e o líquido entra (vira linfa). Segue por pré-coletores (transição; músculo liso pouco desenvolvido) e coletores (3 túnicas, músculo liso desenvolvido, válvulas verdadeiras, com linfonodos no trajeto: aferentes → seio marginal → seios trabeculares → seio medular → eferente). Os coletores convergem em troncos, que levam ao ducto torácico ou ao ducto linfático direito, os quais devolvem a linfa ao sangue no ângulo venoso (subclávia + jugular interna).",
["Entrada pelas junções em botão / filamentos de ancoragem","Pré-coletores (transição)","Coletores: 3 túnicas, músculo liso, válvulas verdadeiras, linfonodos","Troncos → ductos (torácico e linfático direito)","Ângulo venoso (subclávia + jugular interna)"],{s:"P"});
O(1,"Cite o caminho da linfa ao passar pelo linfonodo, indicando por onde entra, por onde circula internamente e por onde sai.",
"Entra pelos vasos linfáticos aferentes (vários, perfuram a cápsula na face convexa) → seio subcapsular (marginal) → seios trabeculares, ao longo das trabéculas → seio medular → sai pelo vaso linfático eferente, no hilo (face côncava). Fluxo unidirecional e lento (muitos aferentes, em geral um eferente).",
["Aferentes pela face convexa","Seio marginal → trabeculares → medular","Eferente no hilo"],{s:"P"});
O(1,"Qual parte do corpo é drenada pelo ducto linfático direito? E pelo ducto torácico? Por que a jugular interna e a subclávia são importantes nesse processo?",
"Ducto linfático direito: quadrante superior direito (lado direito da cabeça e pescoço, membro superior direito e hemitórax direito). Ducto torácico: o restante, a maior parte do corpo (membros inferiores, pelve, abdome e lado esquerdo superior). A subclávia e a jugular interna formam o ângulo venoso, ponto em que os ductos desembocam e a linfa volta à circulação sanguínea.",
["Linfático D: cabeça/pescoço D, MS D, hemitórax D","Torácico: o restante do corpo","Ângulo venoso = subclávia + jugular interna: retorno ao sangue"],{s:"A"});
O(1,"Diferencie capilar sanguíneo de capilar linfático.",
"O capilar linfático começa em fundo cego, é um pouco mais calibroso, tem parede de uma camada endotelial, alta permeabilidade, junções em botão e filamentos de ancoragem; capta líquido, proteínas, células e microrganismos do interstício. O capilar sanguíneo faz parte de um circuito fechado (artéria → capilar → veia).",
["Fundo cego × circuito fechado","Uma camada endotelial, junções em botão, filamentos de ancoragem","Maior permeabilidade e calibre do linfático"],{s:"A"});
O(1,"Cite os órgãos que compõem o anel tonsilar e sua função. Diferencie órgãos linfoides primários e secundários.",
"Anel tonsilar (de Waldeyer): tonsila faríngea (adenoide), tonsilas tubárias, tonsilas palatinas e tonsila lingual; função de defesa, vigiando microrganismos que entram por boca e nariz. Primários (formação/maturação das células de defesa): medula óssea vermelha e timo. Secundários (encontro com o antígeno): linfonodos, baço, tonsilas e tecido linfoide de mucosas.",
["4 grupos de tonsilas","Defesa na entrada da faringe","Primários: medula óssea e timo","Secundários: linfonodos, baço, tonsilas"],{s:"A",c:1});

O(2,"Descreva a vascularização arterial do estômago, por região (curvatura menor, curvatura maior e fundo), citando a origem de cada artéria.",
"Tudo parte do tronco celíaco, que dá gástrica esquerda, esplênica e hepática comum. Curvatura menor: gástrica esquerda (sai direto do celíaco) + gástrica direita (da hepática comum), que se anastomosam. Curvatura maior: gastro-omental esquerda (da esplênica) + gastro-omental direita (da gastroduodenal, que vem da hepática comum), que também se anastomosam. Fundo e face posterior: gástricas curtas + gástrica posterior, relacionadas à esplênica. Venoso: as veias acompanham as artérias; gástricas → sistema porta; gastro-omentais → mesentérica superior e/ou esplênica.",
["Tronco celíaco → gástrica E, esplênica, hepática comum","Menor: gástrica E + D","Maior: gastro-omental E (esplênica) + D (gastroduodenal)","Fundo: gástricas curtas/posterior","Veias acompanham artérias → sistema porta"],{s:"P"});
O(2,"Explique as barreiras anatômicas que protegem o esôfago contra o refluxo gastroesofágico.",
"O esôfago não possui o epitélio resistente ao ácido do estômago; depende de: esfíncter esofágico inferior (contraído em repouso, relaxa só com o bolo), ligamento frenoesofágico (fixa ao diafragma, no hiato), ângulo de His (esôfago abdominal × fundo; ~45°, agudo dificulta o retorno; se aumenta, o refluxo fica mais fácil) e constrição diafragmática. A linha Z é a transição abrupta de mucosa entre esôfago e estômago.",
["Esfíncter esofágico inferior","Lig. frenoesofágico","Ângulo de His ~45°","Constrição diafragmática"],{s:"T"});
O(2,"Quais estruturas se relacionam com o estômago (vizinhança) e de que modo cada uma se liga a ele?",
"Esôfago (entra pela cárdia); duodeno (sai pelo piloro); fígado (liga-se à curvatura menor pelo ligamento hepatogástrico, parte do omento menor); pâncreas (posterior ao estômago); baço (a artéria esplênica segue para ele; dela saem gástricas curtas e gastro-omental esquerda); diafragma (na passagem do esôfago).",
["Esôfago pela cárdia","Duodeno pelo piloro","Fígado pelo lig. hepatogástrico","Pâncreas posterior","Baço (esplênica)"],{s:"A"});

MC(3,"Com base nos estudos anatômicos, assinale a afirmação correta sobre o duodeno:",

O(3,"Descreva o caminho da bile, da vesícula biliar até chegar ao alimento no duodeno, e cite as três estruturas da tríade portal.",
"Vesícula biliar → ducto cístico → junção com o hepático comum → ducto colédoco → (une-se ao ducto pancreático principal na ampola hepatopancreática de Vater, com esfíncter de Oddi) → papila duodenal maior → 2ª porção (descendente) do duodeno, onde se mistura ao alimento. Tríade portal (ligamento hepatoduodenal): artéria hepática própria, veia porta hepática e ducto colédoco.",
["Cístico → colédoco","Ampola de Vater + esfíncter de Oddi","Papila maior na 2ª porção","Tríade: hepática própria, veia porta, colédoco"],{s:"A"});
O(3,"Descreva a circulação arterial do pâncreas.",
"Origem em dois territórios: (1) tronco celíaco — pela hepática comum → gastroduodenal → pancreaticoduodenal superior (cabeça/uncinado junto ao duodeno) e pela esplênica, que dá ramos pancreáticos ao colo, corpo e cauda (corre na borda superior do corpo); (2) artéria mesentérica superior — pancreaticoduodenal inferior, que forma arcadas com a superior. Cabeça e uncinado: arcadas pancreaticoduodenais; corpo e cauda: ramos da esplênica.",
["Celíaco → hepática comum → gastroduodenal → pancreaticoduodenal superior","Esplênica → ramos pancreáticos (colo, corpo, cauda)","Mesentérica superior → pancreaticoduodenal inferior","Arcadas na cabeça"],{s:"A",c:1});
O(3,"Explique a importância do ligamento de Treitz e como ele orienta a investigação clínica de sangramentos digestivos.",
"O ligamento de Treitz (músculo suspensório do duodeno) fixa a flexura duodenojejunal ao diafragma e é o principal marco que separa tubo digestivo alto (acima) de baixo (abaixo). Hematêmese indica origem alta; sangue vivo nas fezes é mais comum no baixo; fezes muito escuras podem ser sangue digerido de origem mais alta. Endoscopia para suspeita alta; colonoscopia para baixa.",
["Flexura duodenojejunal, fixa ao diafragma","Separa TD alto e baixo","Hematêmese = alto; sangue vivo = baixo","Endoscopia × colonoscopia"],{s:"P"});
O(3,"Descreva as quatro porções do duodeno e sua relação com o peritônio.",
"1ª superior: liga-se ao piloro, intraperitoneal. 2ª descendente: recebe as secreções do fígado/vias biliares e do pâncreas pelas papilas, retroperitoneal. 3ª horizontal: cruza da direita para a esquerda, anterior à aorta e à cava inferior (vasos mesentéricos superiores passam anteriormente a ela), retroperitoneal. 4ª ascendente: sobe pelo lado esquerdo da coluna e termina na flexura duodenojejunal (ligamento de Treitz), retroperitoneal.",
["1ª intra","2ª papilas, retro","3ª anterior à aorta e cava","4ª até a flexura duodenojejunal"],{s:"T"});

O(4,"Descreva as principais diferenças anatômicas entre o jejuno e o íleo.",

O(4,"Quais segmentos do tubo digestivo são intraperitoneais e quais são retroperitoneais/extraperitoneais?",

["Intra: estômago, 1ª duodeno, jejuno, íleo, ceco, transverso, sigmoide, reto proximal","Retro: 2ª duodeno, pâncreas, ascendente, descendente, reto médio","Reto inferior: extra"],{s:"A"});

O(4,"Descreva o reto e o canal anal: início, relação com o peritônio, características e esfíncteres.",

O(4,"Explique a função da válvula ileocecal e as posições possíveis do apêndice, relacionando-as com a clínica da apendicite.",

O(5,"Descreva a circulação coronariana arterial e venosa principal do coração, com os sulcos que servem de guia.",
"Artérias: duas coronárias saem da raiz da aorta. Coronária esquerda → circunflexa (contorna para trás pelo sulco coronário) + interventricular anterior/descendente anterior (sulco interventricular anterior). Coronária direita → marginal direita (margem direita) + interventricular posterior (sulco interventricular posterior). Veias: seio coronário (coletor posterior) recebe veia interventricular anterior (que continua como cardíaca magna), veia interventricular posterior (= cardíaca média) e veia cardíaca parva (região direita/sulco coronário).",
["Coronárias saem da raiz da aorta","Esquerda: circunflexa + IV anterior","Direita: marginal direita + IV posterior","Seio coronário recebe magna, média e parva"],{s:"T"});
O(5,"Diferencie pectíneos, crista terminal, trabéculas cárneas e músculos papilares: onde ficam e para que servem.",
"Pectíneos: cristas paralelas no átrio direito e aurícula direita (pouco desenvolvidos no átrio E); reforçam a contração atrial sem aumentar muito a massa. Crista terminal: crista vertical do átrio direito, separa a região rugosa anterior (pectíneos) da lisa posterior (seio venoso). Trabéculas cárneas: saliências na face interna dos ventrículos; ajudam a mecânica da contração e reduzem a turbulência. Músculos papilares: nos ventrículos, ligados às cordas tendíneas e às valvas AV (VD: 3; VE: 2).",
["Pectíneos: átrio D","Crista terminal separa rugoso × liso","Trabéculas: ventrículos","Papilares: cordas tendíneas, 3 VD e 2 VE"],{s:"T"});
O(5,"Descreva o trajeto do sangue pelas cavidades e valvas do coração e a sequência da aorta até sua porção abdominal.",
"Veias cavas → átrio D → valva tricúspide → ventrículo D → valva pulmonar → artérias pulmonares/pulmões → átrio E → valva mitral → ventrículo E → valva aórtica → aorta. Aorta: valva aórtica → raiz → aorta ascendente → arco (braquiocefálico, carótida comum E, subclávia E) → aorta descendente torácica → diafragma → aorta abdominal.",
["Ordem das cavidades e valvas","Sentido do fluxo","Segmentos da aorta","3 ramos do arco"],{s:"T"});

O(6,"Descreva o trajeto da urina desde a papila renal até o meio externo e as partes da uretra masculina.",

O(6,"Descreva as diferenças anatômicas da uretra e da bexiga: (a) uretra feminina × masculina; (b) bexiga masculina × feminina.",

O(8,"Descreva, em ordem, todas as estruturas do sistema reprodutor masculino pelas quais os espermatozoides passam, desde a produção nos testículos até serem expelidos na ejaculação.",

O(8,"Quais camadas do saco escrotal são perfuradas para fazer uma vasectomia?",
"A vasectomia acessa o ducto deferente dentro do funículo espermático, na bolsa escrotal. Atravessam-se, de fora para dentro: pele do escroto → fáscia superficial do escroto → fáscia espermática externa → fáscia cremastérica (com o músculo cremáster) → fáscia espermática interna, chegando ao deferente. Não se perfuram a túnica vaginal nem a albugínea, pois envolvem o testículo/epidídimo e não sobem pelo funículo. (Dedução a partir das camadas — confira com a professora/livro.)",
["Pele e fáscia superficial","Espermática externa","Cremastérica (+ cremáster)","Espermática interna","Não perfura túnica vaginal e albugínea"],{s:"A",c:1});
O(8,"Descreva o canal inguinal: anéis, paredes, trígono, conteúdo e por que o anel profundo funciona como ‘válvula’.",
"Abertura de 4–6 cm na parede abdominal (ambos os sexos), da região superolateral (anel profundo) à inferomedial (anel superficial). Anel profundo: ponto médio do ligamento inguinal, ~1 cm acima, formado pela fáscia transversal; fecha quando a pressão abdominal sobe, pela contração do transverso e do oblíquo interno. Anel superficial: ~1 cm acima e lateral ao tubérculo púbico, em “V”, com pilar lateral mais espesso que o medial. Paredes: anterior = aponeurose do oblíquo externo; teto = oblíquo interno; posterior = transverso. Trígono inguinal (Hesselbach): limites medial = reto abdominal; lateral = vasos epigástricos inferiores; inferior = lig. inguinal; ponto fraco. Conteúdo: nervo ilioinguinal, ramo genital do genitofemoral e vasos; homem: funículo; mulher: lig. redondo do útero.",
["Anéis profundo e superficial","Paredes","Trígono","Conteúdo","Mecanismo de fechamento"],{s:"T"});
O(8,"Descreva o funículo espermático: onde começa e termina, o conteúdo e as camadas, relacionando-as com a parede abdominal.",
"Começa no anel inguinal profundo e termina no polo superior da túnica vaginal do testículo. Conteúdo: ducto deferente, artéria testicular, plexo venoso pampiniforme e nervos (ilioinguinal e ramo genital do genitofemoral). Camadas (continuação da parede abdominal): fáscia transversal → espermática interna; oblíquo interno (e fáscia) → cremastérica (+ cremáster); oblíquo externo → espermática externa. As túnicas vaginal e albugínea são próprias do testículo.",
["Início e término","Conteúdo","3 fáscias e origem","Túnicas são do testículo"],{s:"T"});
O(8,"Explique o papel do líquido da vesícula seminal e da próstata no sêmen e cite as partes da uretra masculina.",
"Vesícula seminal: líquido que protege e nutre os espermatozoides (frutose), ~60% do sêmen, neutraliza o ambiente ácido da vagina. Próstata: líquido que liquefaz (fluidifica) o sêmen, pegajoso, após ~30 min; os dois líquidos são importantes. Bulbouretrais: muco que lubrifica a uretra antes da ejaculação. Uretra masculina: intramural, prostática (recebe ductos prostáticos e ejaculatórios), membranácea e esponjosa.",
["Vesícula: nutre, ~60%","Próstata: liquefaz após 30 min","Bulbouretrais: lubrificam","4 partes da uretra"],{s:"T"});

O(9,"Fale sobre a tuba uterina: subdivisões, função de cada parte, camadas da parede e controle do peristaltismo.",
"Tuba uterina: bilateral, muscular oca, ~10 cm; transporta óvulos até o útero e espermatozoides em sentido contrário. Partes: infundíbulo (mais dilatada, com fímbrias, voltada ao ovário), ampola (parte principal; fecundação), istmo (diâmetro diminui), parte uterina (nova redução; óstio da tuba, que se abre no corpo do útero). Parede: mucosa (pregas longitudinais e células ciliadas), muscular (longitudinal e circular) e serosa. Peristaltismo hormonal: antes da ovulação (pico de estrogênio) contrai, favorecendo a subida dos espermatozoides; na liberação do óvulo (pico de progesterona) relaxa, permitindo fluxo unidirecional do óvulo ao útero. Sustentação: ligamento largo (mesossalpinge). Irrigação (ramos das artérias uterina e ovárica) e drenagem venosa: complemento de anatomia geral.",
["4 partes e funções","Camadas: mucosa, muscular, serosa","Estrogênio contrai × progesterona relaxa","Mesossalpinge","Irrigação uterina/ovárica (complemento)"],{s:"A",c:1});
O(9,"Analise a imagem (vista superior da pelve feminina) e escreva o nome das estruturas indicadas e sua função (ligamentos do útero).",
"Ligamento sacro-uterino: posterior, projeta-se para trás e fixa o útero (colo). Ligamento reto-uterino: posterior, circunda o reto, com fibras no colo. Ligamento transverso do colo (cardinal/Mackenrodt): lateral, contorna o colo e forma uma ‘asa’ até a face lateral do ilíaco. Ligamento redondo do útero: sustenta a parte lateral e superior do útero e entra no canal inguinal. Ligamento vesico-uterino: anterior, fixa o útero no sentido da bexiga. Ligamento útero-ovariano: liga o útero ao ovário. (A identificação por número depende da imagem da prova.)",
["Sacro-uterino","Reto-uterino","Transverso do colo/cardinal","Redondo","Vesico-uterino","Útero-ovariano"],{s:"A"});
O(9,"Descreva o útero: regiões, camadas, posições, colo (orifícios) e funções.",
"Órgão ímpar, na pelve, superior e posterior à bexiga, em pera (~7–8 × 4–5 × 2–3 cm). Regiões: fundo, corpo e colo. Camadas: perimétrio (serosa externa), miométrio (muscular média), endométrio (interna, muda no ciclo). Posições: antevertido (normal), anteflexão (excessiva), retrovertido, retrofletido — não interferem na fertilidade. Colo: canal vaginal → orifício externo → canal endocervical → orifício interno → cavidade uterina (até 5 cm); ectocérvix × endocérvix. Funções: alojar o embrião, implantação (nidificação) e participar do canal de parto (contrações).",
["Regiões","3 camadas","Posições","Orifícios do colo","Funções"],{s:"T"});
O(9,"Descreva a dinâmica do folículo ovariano, o papel do corpo lúteo e a estrutura interna do ovário.",
"Córtex (externo): folículos primordiais, primários, secundários e maduros (de Graaf). Medula (interna): tecido conjuntivo frouxo, vasos e nervos. Ultrassom: ~12 folículos prontos → 1 selecionado (o que mais responde aos hormônios), 18–25 mm → ruptura e liberação do óvulo → óvulo segue às tubas → corpo lúteo (remanescente do folículo), que produz progesterona mantendo o endométrio; mantida até a 12ª semana se houver gestação, depois a placenta continua.",
["Córtex × medula","~12 → 1 folículo (18–25 mm)","Ruptura → óvulo → tuba","Corpo lúteo → progesterona (até 12ª semana)"],{s:"T"});
O(9,"Descreva o canal vaginal e a vulva (estruturas e funções).",
"Canal vaginal: ímpar, tubular, do colo do útero ao vestíbulo da vagina; 7–10 cm em repouso; órgão de cópula, escoa sangue menstrual, recebe o sêmen e forma com o útero o canal de parto; aumenta de tamanho com a excitação. Divisões: fórnice (teto, ao redor do colo), corpo (principal) e óstio (pode haver hímen). Vulva (pudendo feminino): monte do púbis (pelos, gordura), lábios maiores (pele e gordura), lábios menores (conjuntivo elástico), clitóris (glande e dois corpos cavernosos) e vestíbulo (óstio externo da uretra, menor e anterior, e óstio da vagina, maior).",
["Vagina: 7–10 cm, funções","Fórnice, corpo, óstio","Vulva: monte, lábios, clitóris, vestíbulo"],{s:"T"});

O(1,"Interprete o leucograma: leucócitos 2.800/µL; bastonetes 2% (56); segmentados 20% (560); linfócitos 70% (1.960); atípicos 7% (196); monócitos 1% (28); eosinófilos 0; basófilos 0; plaquetas 70.000/mm³. Qual o provável agente e quais as alterações?",
"Padrão viral (a clínica orienta para dengue). Leucopenia (2.800/µL; ref. 4.000–11.000). Neutropenia (segmentados 20% = 560/µL; ref. 2.000–7.500; bastonetes 56/µL, sem desvio à esquerda). Linfocitose relativa (70%; ref. 25–40%) com contagem absoluta normal (1.960/µL; ref. 1.500–4.000). Linfócitos atípicos presentes (7% = 196/µL): linfócitos reativos da resposta viral. Monocitopenia (1%; 28/µL), eosinófilos e basófilos zerados. Plaquetopenia/trombocitopenia (70.000/mm³; ref. 150.000–450.000).",
["Leucopenia","Neutropenia","Linfocitose relativa (absoluto normal)","Atípicos = reativos","Plaquetopenia","Padrão viral (dengue pela clínica)"],{s:"P"});
O(1,"Paciente com dor de cabeça; líquor turvo, pouca glicose, bactérias; sangue com aumento absoluto de neutrófilos e aumento absoluto/relativo de bastonetes e monócitos. Explique como os achados indicam infecção bacteriana.",
"Líquor turvo: muitas células (neutrófilos) e bactérias — o ‘pus’ do SNC. Pouca glicose: bactérias e neutrófilos consomem a glicose. Bactérias na bacterioscopia confirmam o agente. Sangue: aumento absoluto de neutrófilos (neutrofilia) = padrão bacteriano clássico; bastonetes aumentados = desvio à esquerda (a medula lança formas jovens; infecção importante/grave); monócitos aumentados = fagócitos/macrófagos participando da inflamação.",
["Líquor turvo","Glicose baixa","Bactérias","Neutrofilia","Desvio à esquerda (bastonetes)","Monocitose"],{s:"A"});
O(1,"Explique o que é desvio à esquerda, por que ocorre e diferencie-o de neutrofilia e de ‘desvio à direita’.",
"Desvio à esquerda é o aumento de formas jovens de neutrófilos (bastonetes, metamielócitos, mielócitos...) no sangue periférico. Ocorre porque sinais inflamatórios (IL-1, fatores estimuladores de colônias e produtos de bactérias) aceleram a produção e a liberação da reserva da medula, que não espera a maturação completa. Neutrofilia = aumento do número de neutrófilos; não é sinônimo. ‘Desvio à direita’ não deve ser usado: descreve-se ‘neutrófilos hipersegmentados’ (≥ 5 lóbulos).",
["Aumento de formas jovens","Mecanismo: medula acelerada","≠ neutrofilia","Não usar ‘desvio à direita’"],{s:"T"});
O(1,"Descreva os passos para interpretar um leucograma e diferencie o padrão bacteriano do viral.",
"1) Total de leucócitos para a idade; 2) olhar a diferencial (quem predomina); 3) preferir absolutos; 4) somar bastonetes + segmentados; 5) procurar bastonetes/formas jovens (desvio à esquerda); 6) relacionar com o contexto clínico; 7) reconhecer o padrão. Bacteriano: neutrofilia + desvio à esquerda, com leucocitose (pode haver leucopenia em quadros graves). Viral: linfocitose, frequentemente leucopenia (pode ser normal ou alto), linfócitos atípicos; desvio à esquerda não é típico.",
["7 passos","Absoluto > relativo","Bacteriano: neutrofilia + desvio","Viral: linfocitose, atípicos","Contexto clínico"],{s:"T"});
O(1,"Explique os pools de neutrófilos (medular, marginal e circulante) e por que o exercício e a adrenalina elevam os neutrófilos.",
"Pool medular (~90%): células em maturação e reserva. Pool marginal (no sangue, ~60% do periférico): encostados na parede do vaso, o exame não os vê. Pool circulante (~40%): é o que o hemograma enxerga. Adrenalina, exercício, corticoides e infecções empurram neutrófilos do marginal para o circulante (neutrofilia de distribuição, rápida e fugaz); com repouso ocorre a remarginação.",
["Medular × marginal × circulante","Marginal invisível ao exame","Neutrofilia de distribuição","Remarginação"],{s:"T"});

O(3,"Discuta o caso da ferida após queda de bicicleta: agente mais provável, papel do neutrófilo e como coletar o material.",
"Pistas: dor, rubor, calor, edema, latejamento e pus após 2 dias. Agente mais provável: Staphylococcus aureus ou estafilococo coagulase-negativo da microbiota da pele. O neutrófilo está no pus, mas não é o agente etiológico. Coleta: remover pus velho e sujeira superficial, limpar com soro e coletar material da base da lesão, onde há microrganismo viável.",
["S. aureus / coagulase-negativo","Neutrófilo ≠ agente","Remover pus velho, limpar com soro","Coletar da base da lesão"],{s:"T"});
O(3,"Diferencie colonização de infecção e explique a conduta com a paciente transferida de outro hospital com ‘bactéria terror’.",
"Colonizado porta a bactéria sem doença; infectado tem foco clínico (ex.: ITU, ferida infectada); resultado positivo de colonização não significa necessariamente doença. Paciente transferida: swab nasal e retal/anal (narina primeiro, depois reto, no mesmo meio) e isolamento até o resultado, para não disseminar na unidade. O agente do caso é Enterococcus resistente à vancomicina (VRE).",
["Colonização × infecção","Swab nasal e retal","Isolamento até o resultado","VRE"],{s:"T"});
O(3,"Descreva as infecções causadas por S. aureus (supurativas, disseminadas e mediadas por toxinas) e as toxinas envolvidas.",
"Supurativas: impetigo, foliculite, furúnculo, carbúnculo e feridas. Disseminadas: bacteremia, endocardite, pneumonia/empiema, osteomielite e artrite séptica. Mediadas por toxinas: síndrome do choque tóxico, síndrome da pele escaldada/impetigo bolhoso e intoxicação alimentar. Toxinas: esfoliativas (proteases que rompem ligações da epiderme → bolhas), enterotoxinas (peristaltismo e perda de fluidos → náuseas, vômitos, diarreia) e toxina do choque tóxico (extravasamento de líquido e dano celular).",
["Supurativas","Disseminadas","Toxinas","3 toxinas e efeitos"],{s:"T"});
O(3,"Resuma os estreptococos de importância clínica (S. pyogenes, S. agalactiae, grupo viridans e S. pneumoniae) e a classificação por hemólise.",
"Classificação em ágar-sangue: alfa (incompleta), beta (total), gama (ausência). S. pyogenes: erisipela, celulite, fascite necrotizante; febre reumática e GN pós-estreptocócica. S. agalactiae: colonização materna, sepse/pneumonia/meningite neonatais; triagem + penicilina intraparto. Viridans: abscessos, septicemia em neutropênicos, endocardite e cárie. S. pneumoniae: pneumonia, otite, sinusite, meningite; vacina e evitar aglomerações.",
["Alfa/beta/gama","S. pyogenes","S. agalactiae","Viridans","S. pneumoniae"],{s:"T"});
O(3,"Explique por que as bactérias Gram-negativas são o maior problema hospitalar e cite os grupos e os mecanismos de resistência.",
"Pela alta taxa de resistência, inclusive a antibióticos de última geração: tratamento mais difícil e caro, com menos opções. Fermentadoras (enterobactérias): E. coli, Enterobacter, Klebsiella, Serratia, Citrobacter, Proteus (infecções respiratórias e urinárias). Não fermentadoras: Pseudomonas, Stenotrophomonas, Burkholderia, Acinetobacter (P. aeruginosa e Acinetobacter no trato respiratório inferior). Resistência intrínseca; enzimas que inativam antibióticos: beta-lactamases (beta-lactâmicos) e metalo-beta-lactamases (carbapenêmicos).",
["Resistência elevada","Fermentadoras × não fermentadoras","Beta-lactamases","Metalo-beta-lactamases (carbapenêmicos)"],{s:"T"});

O(4,"Explique a diferença entre exame micológico direto e cultura, e o raciocínio de coleta e interpretação em micoses superficiais.",
"Direto: visualiza o fungo/estruturas na própria amostra (KOH clareia pele, unha e cabelo); é rápido e pode orientar o tratamento; o laudo descreve e usa ‘sugestivo de’. Cultura: permite crescimento e identificação, é demorada (≥ ~15 dias; ~30 dias nos laboratórios), a colônia sozinha não basta e exigem-se etapas como microcultivo. Raciocínio: olhar local e padrão da lesão → origem (solo, animal, pessoa) → coletar da área ativa → reconhecer a estrutura no direto → laudo ‘sugestivo’ → cultura se precisar identificar.",
["Direto: rápido, KOH, ‘sugestivo’","Cultura: demorada, etapas de identificação","Colônia sozinha não basta","Coletar da área ativa"],{s:"T"});
O(4,"Descreva os achados do exame direto em: tinea pedis, pitiríase versicolor, tinea do couro cabeludo, criptococose e candidíase vaginal.",
"Tinea pedis: escamas/tampa da vesícula com KOH → hifas hialinas septadas + artroconídios (sugestivo de dermatófitos). Pitiríase versicolor: escamas → filamentos curtos e tortuosos + blastoconídios agrupados (Malassezia). Couro cabeludo: fios/toquinhos → esporos fora (ectotrix: Microsporum e alguns Trichophyton) ou dentro (endotrix: Trichophyton). Criptococose: LCR com tinta nanquim → leveduras capsuladas (halo claro). Candidíase vaginal: secreção ao Gram → leveduras/blastoconídios + pseudo-hifas (Candida).",
["Tinea pedis: hialino septado + artroconídios","P. versicolor: curtos/tortuosos + blastoconídios","Ectotrix × endotrix","Nanquim: halo capsular","Gram: levedura + pseudo-hifa"],{s:"T"});
O(4,"Diferencie dermatofitoses, leveduroses e ceratofitoses quanto ao padrão clínico e cite exemplos.",
"Dermatofitoses: lesões arredondadas com borda ativa/vesiculosa e prurido; ex.: pé de atleta. Leveduroses: lesões mais exsudativas, em regiões intertriginosas (virilha, dobras, área submamária); ex.: candidíase. Ceratofitoses: grupo superficial sem reação de hipersensibilidade cutânea; ex.: piedra, pitiríase versicolor e tinea nigra. Outros: onicomicoses e infecções do couro cabeludo.",
["Dermatofitoses: borda ativa, prurido","Leveduroses: exsudativas, dobras","Ceratofitoses: sem hipersensibilidade","Exemplos"],{s:"T"});
O(4,"Explique a ecologia dos fungos (geofílicos, zoofílicos, antropofílicos) e por que a anamnese ambiental importa.",
"Geofílicos vivem no solo (ex.: Fusarium; trauma com material vegetal pode inocular — ceratite após ferimento ocular na colheita). Zoofílicos vêm de animais (ex.: Microsporum canis; cães e principalmente gatos). Antropofílicos vivem no homem (dermatófitos), com transmissão entre pessoas, mas só a exposição não basta: são necessárias condições favoráveis na pele. A história de contato (ex.: gato da vizinhança em criança com lesão no couro cabeludo) ajuda a direcionar o diagnóstico.",
["Geofílicos/solo","Zoofílicos/animais","Antropofílicos/homem","Valor da anamnese de contato"],{s:"T"});

O(5,"Explique por que o glicogênio muscular não contribui diretamente para a glicemia no jejum, ao contrário do hepático.",
"O músculo armazena glicogênio, mas usa essa reserva para si (contração) e não a disponibiliza como glicose livre para o sangue. Razão molecular: o músculo não tem glicose-6-fosfatase; a glicose-6-fosfato do glicogênio não é desfosforilada e segue a glicólise no próprio músculo. O fígado quebra o glicogênio e libera glicose para a circulação, mantendo a glicemia (inclusive para o cérebro), e é também o órgão da gliconeogênese.",
["Músculo usa para si","Sem glicose-6-fosfatase","Fígado libera glicose livre","Fígado: gliconeogênese"],{s:"A",c:1});
O(5,"Explique por que a glicosúria aparece quando a glicemia ultrapassa ~180 mg/dL e como se relaciona com poliúria e polidipsia.",
"Os rins filtram a glicose e a reabsorvem, mas a capacidade de reabsorção é limitada. Acima de ~180 mg/dL, a glicose filtrada excede esse limite e aparece na urina (glicosúria). A glicose não reabsorvida retém água no túbulo (efeito osmótico), causando poliúria. A perda de água leva a desidratação e sede (polidipsia). Somam-se polifagia e perda de peso: os ‘4 Ps’.",
["Limiar ~180 mg/dL","Reabsorção limitada","Efeito osmótico → poliúria","Desidratação → polidipsia","4 Ps"],{s:"A"});
O(5,"Homem de 42 anos, IMC 31, pai com DM2, assintomático; mesma amostra: glicemia de jejum 118 mg/dL e HbA1c 6,0%. a) Classifique o perfil glicêmico. b) Qual exame adicional é recomendado e quais resultados indicariam diabetes ou risco aumentado? c) Com que frequência reavaliar se o diabetes não for confirmado?",
"a) Jejum 118 (faixa 100–125) e HbA1c 6,0% (faixa 5,7–6,4%): pré-diabetes; nenhum alcança o ponto de diabetes (≥ 126; ≥ 6,5%). IMC 31 e pai com DM2 são fatores de risco adicionais. b) TOTG com 75 g de glicose (indicado no pré-diabetes; a diretriz prefere a dosagem de 1 h). 1 h: diabetes ≥ 209; risco aumentado 155–208; normal < 155. 2 h: diabetes ≥ 200; risco aumentado 140–199; normal < 140. c) Persistindo pré-diabetes: pelo menos anualmente; TOTG normal: < 3 fatores de risco → a cada 3 anos; ≥ 3 (ou FINDRISC alto) → pelo menos anualmente.",
["Pré-diabetes nos dois exames","TOTG 75 g (preferência 1 h)","Cortes 1 h e 2 h","Reavaliação anual ou a cada 3 anos"],{s:"A",c:1});
O(5,"Descreva a integração metabólica entre fígado, músculo, tecido adiposo e cérebro na transição do estado alimentado ao jejum prolongado, com o papel da insulina, do glucagon e dos corpos cetônicos. Explique por que o DM1 sem insulina se assemelha ao jejum.",
"Alimentado (insulina ↑, glucagon ↓): fígado faz glicogênese, glicólise e lipogênese, exportando VLDL; tecido adiposo capta glicose (GLUT4) e deposita TAG (insulina inibe lipólise); músculo capta glicose e forma glicogênio para uso próprio; cérebro usa glicose. Jejum prolongado (insulina ↓, glucagon/epinefrina ↑): fígado faz glicogenólise (até ~24 h), depois gliconeogênese, oxida ácidos graxos → acetil-CoA → cetogênese e ureogênese; tecido adiposo faz lipólise (AG + glicerol); músculo usa AG e fornece aminoácidos; cérebro usa glicose do fígado e passa a usar corpos cetônicos. Cetogênese: o oxaloacetato é desviado para a gliconeogênese, o excesso de acetil-CoA vira corpos cetônicos. DM1 sem insulina: músculo e adiposo não captam glicose (GLUT4) apesar da hiperglicemia; predomina o glucagon com lipólise, gliconeogênese e cetogênese sem freio — glicose alta + corpos cetônicos altos (risco de cetoacidose). No jejum fisiológico a glicemia é baixa; no DM1 é alta com insulina ausente.",
["Alimentado: insulina, glicogênese, lipogênese","Jejum: glicogenólise → gliconeogênese","Cetogênese (acetil-CoA/oxaloacetato)","Cérebro usa corpos cetônicos","DM1: ‘jejum’ com glicose alta"],{s:"A",c:1});
O(5,"Compare glicemia de jejum, HbA1c e TOTG (o que mede cada um, vantagens e limitações) e explique quando repetir exames.",
"Glicemia de jejum: glicose no momento da coleta (jejum 8–12 h). HbA1c: fração da hemoglobina ligada à glicose, resume ~3 meses (hemácia vive ~120 dias; termo correto: glicada); interferem anemias/hemoglobinopatias. TOTG: amostra basal + 75 g de glicose, com medidas em 1 h e 2 h; mostra a resposta a uma carga; a solução açucarada pode causar náusea, por isso convém ver a glicemia basal antes. Glicemia capilar não é a confirmação laboratorial. Se apenas um exame estiver alterado, repetir; dois alterados na mesma amostra confirmam (exceção: glicemia ao acaso ≥ 200 com sintomas).",
["Jejum = momento","HbA1c = ~3 meses; interferências","TOTG = 75 g","Um alterado → repetir"],{s:"T"});

O(6,"Interprete: proteína total 5,6 g/dL; albumina 2,5; globulinas 3,1; A/G 0,8 (referências: 6,5–8,1; 3,5–5,2; 1,7–3,5; 0,9–2,0) em paciente de 70 anos com US compatível com cirrose. Justifique e cite as consequências.",
"Proteína total 5,6 (< 6,5): diminuída. Albumina 2,5 (< 3,5): hipoalbuminemia. Globulinas 3,1: dentro da faixa (5,6 − 2,5 = 3,1). A/G 0,8 (< 0,9): relação reduzida/invertida (2,5 ÷ 3,1), porque o que caiu foi a albumina. Justificativa: doença hepática (cirrose, com tecido cicatricial) produz menos albumina (menor síntese), puxando as proteínas totais para baixo e invertendo a relação A/G. Consequência: como a albumina segura a água dentro dos vasos, sua queda favorece edema e até ascite.",
["Hipoproteinemia","Hipoalbuminemia","Globulinas normais","A/G invertida","Menor síntese hepática","Edema/ascite"],{s:"P"});
O(6,"Exame de sangue com proteína total baixa, albumina baixa e clearance de creatinina de 28 mL/min. Explique a relação entre a função renal e a alteração da proteína.",
"O clearance de creatinina muito baixo indica função renal muito reduzida. Na doença renal há perda de proteína na urina, principalmente albumina (glomerulonefrite, síndrome nefrótica, doença tubular). Essa perda reduz a albumina e puxa as proteínas totais para baixo. Consequência: a queda da albumina reduz a pressão coloidosmótica e favorece edema (a água sai dos vasos).",
["Clearance 28 = função renal muito reduzida","Perda urinária de albumina","Proteínas totais ↓","Edema"],{s:"A"});
O(6,"Mulher de 45 anos, inchaço generalizado e urina espumosa; proteínas totais 4,8 g/dL e albumina 1,9 g/dL. a) Calcule globulinas e A/G. b) Explique o mecanismo do edema.",
"a) Globulinas = 4,8 − 1,9 = 2,9 g/dL (dentro de 1,8–4,4). A/G = 1,9 ÷ 2,9 ≈ 0,66 (< 1,1): relação invertida. Proteínas totais e albumina estão baixas (6,5–8,2 e 3,7–5,2). b) Quadro compatível com síndrome nefrótica (urina espumosa = proteinúria). Lesão glomerular → perda urinária maciça de albumina → hipoalbuminemia → queda da pressão coloidosmótica → a água deixa o vaso para o interstício → edema (e ascite, se grave). Na eletroforese: albumina ↓ e pico de α2-macroglobulina ↑.",
["Globulinas 2,9","A/G ≈ 0,66","Síndrome nefrótica","Hipoalbuminemia → ↓ pressão oncótica","Edema"],{s:"A",c:1});
O(6,"Homem de 60 anos, etilista, com cirrose; eletroforese: albumina diminuída e aumento policlonal difuso em γ com fusão β–γ. a) Por que a albumina e os fatores de coagulação estão diminuídos? b) Compare com o traçado do mieloma múltiplo.",
"a) O fígado sintetiza a albumina e a maioria das proteínas da coagulação (inclusive o fibrinogênio); na cirrose a perda de massa funcional de hepatócitos reduz a produção. Consequências: ↓ pressão coloidosmótica (edema, ascite) e tendência a sangramento. b) Cirrose: aumento policlonal (várias imunoglobulinas), banda larga e difusa em γ com fusão β–γ, albumina diminuída. Mieloma múltiplo: aumento monoclonal (um clone de plasmócitos), pico estreito e alto em γ (base estreita; componente M), albumina variável. O que distingue é o formato do aumento.",
["Síntese hepática ↓","Albumina e coagulação ↓","Cirrose: policlonal, ponte β–γ","Mieloma: pico estreito monoclonal"],{s:"A",c:1});
O(6,"Por que a albumina é pouco sensível para desnutrição aguda? Qual proteína é mais adequada e por quê?",
"A albumina tem grande reserva corporal e meia-vida longa (≈ 20 dias): demora semanas para cair, então não reflete déficit agudo; além disso é influenciada por hidratação, perdas (rim, intestino) e inflamação (fase aguda negativa). Mais adequada: pré-albumina (transtirretina), de meia-vida curta (≈ 2 dias) e pequena reserva, que responde rapidamente à ingestão de proteína. A transferrina (≈ 8–10 dias) é intermediária.",
["Albumina: meia-vida ~20 dias","Influenciada por hidratação/perdas/inflamação","Pré-albumina: ~2 dias"],{s:"A",c:1});
O(6,"Como responder a uma questão sobre hemoglobinopatia? Descreva o raciocínio e diferencie traço de doença falciforme.",
"1) Descrever o hemograma sem ‘batizar’ a doença (microcítico, hipocrômico etc. só descrevem a anemia). 2) Ler a eletroforese de hemoglobina: quais hemoglobinas aparecem e em que proporção. 3) Diferenciar traço de doença: AS = HbA e HbS (HbA maior), em geral sem a anemia típica; SS = HbS predominante e HbA ausente. 4) Se a HbF estiver alta, lembrar o papel protetor parcial. Alterações do eritrograma sozinhas não fecham talassemia nem anemia falciforme.",
["Hemograma só descreve","Eletroforese de hemoglobina","AS × SS","HbF protetora parcial"],{s:"T"});
O(6,"Explique a fisiopatologia da anemia falciforme e como a HbF modifica o quadro.",
"HbS + desoxigenação → falcização das hemácias → menor deformabilidade → vasoclusão → dor, inflamação e isquemia do tecido; as crises são dolorosas porque as hemácias falcizadas ‘empilham’, dificultam o fluxo nos pequenos vasos e reduzem a oxigenação. Nos primeiros meses a HbF alta dificulta a falcização; com a queda da HbF, geralmente a partir do 3º mês, as manifestações podem começar. HbF mais alta → crises menos frequentes, mas sem proteção total.",
["HbS + hipóxia → foice","Vasoclusão","Dor e isquemia","HbF protege parcialmente"],{s:"T"});

O(7,"Homem de 52 anos: CT 245, HDL-c 42, TG 210, LDL-c 161 mg/dL. (a) Padrão principal? (b) Calcule o não-HDL-c. (c) Significado bioquímico do não-HDL-c? (d) Por que não interpretar só o LDL-c? (e) O que mais é necessário para discutir uma meta de LDL-c?",
"a) Dislipidemia mista: LDL-c 161 (> 160) e TG 210 (> 150 em jejum; > 175 sem jejum). b) Não-HDL-c = 245 − 42 = 203 mg/dL. c) Colesterol de todas as lipoproteínas aterogênicas (LDL, IDL, VLDL e remanescentes, todas com ApoB): carga aterogênica total. d) Com TG alto, a estimativa do LDL-c perde precisão; o não-HDL-c e a ApoB captam melhor a carga real, e o perfil deve ser integrado ao contexto clínico e ao risco individual. e) Estratificação de risco (categoria e metas), fatores de risco (pressão, diabetes, tabagismo, antecedentes familiares precoces), agravantes (Lp(a), doenças inflamatórias), ApoB, escore de cálcio e causas secundárias.",
["Mista","Não-HDL-c = 203","Todas as partículas com ApoB","LDL-c impreciso com TG alto","Risco individual"],{s:"P"});
O(7,"Mulher de 48 anos, perfil sem jejum: CT 218, HDL-c 46, TG 468, LDL-c 106. (a) Estar sem jejum invalida? (b) O que chama atenção? (c) Conduta? (d) Por que TG alto dificulta o LDL-c estimado? (e) Parâmetro útil?",
"a) Não: CT, HDL-c, LDL-c e não-HDL-c não dependem do estado alimentar; o TG é o que mais muda; o laudo informa o jejum. b) TG 468 (> 440), que muda a conduta e compromete a estimativa do LDL-c. c) Nova coleta com jejum de 12 h, a critério do solicitante. d) O LDL-c é estimado por fórmula (CT − HDL-c − TG/divisor); Friedewald usa divisor fixo 5 e perde precisão com TG alto; Martin/Hopkins (divisor 3,1–11,9) ainda pode subestimar com TG > 800. e) Não-HDL-c = 218 − 46 = 172 mg/dL (independe de jejum e de fórmula com TG) e ApoB.",
["Não invalida","TG 468 > 440","Repetir em jejum de 12 h","Fórmula do LDL-c","Não-HDL-c = 172"],{s:"P"});
O(7,"Descreva o percurso dos TG da dieta do intestino ao fígado (via exógena).",
"Sais biliares emulsificam a gordura; lipases degradam TG; micelas são absorvidas pelo enterócito, que ressintetiza TG. TG + colesterol + fosfolipídeos + ApoB-48 formam o quilomícron, secretado na linfa e depois no sangue. No plasma, recebe ApoC-II (e ApoE); a ApoC-II ativa a LPL no endotélio capilar do tecido adiposo e do músculo, que hidrolisa TG em ácidos graxos + glicerol (AG vão ao músculo e aos adipócitos). O quilomícron encolhe e vira remanescente (rico em colesterol, com ApoE), captado pelo fígado por receptores.",
["Micelas → enterócito","Quilomícron com ApoB-48","ApoC-II ativa LPL","Remanescente → fígado"],{s:"P"});
O(7,"Explique VLDL → IDL → LDL e como a célula capta a LDL.",
"O fígado sintetiza a VLDL (rica em TG, ApoB-100). Na circulação a LPL remove TG, formando a IDL (ApoB-100 e ApoE); a lipase hepática remodela a IDL em LDL, rica em colesterol, com uma única ApoB-100. O LDLR reconhece ApoB-100/ApoE e liga a LDL; ocorre endocitose mediada por receptor; o endossomo ácido separa a LDL do receptor (reciclado); a LDL é degradada no lisossomo liberando colesterol livre; o colesterol intracelular ↑ reduz novos LDLR e a HMG-CoA redutase e ativa a ACAT. Defeito do LDLR ou da ApoB → hipercolesterolemia familiar.",
["VLDL → IDL → LDL","Papel da LPL e lipase hepática","LDLR, endocitose, lisossomo","Retroalimentação","HF"],{s:"P"});
O(7,"Analise: ‘quanto maior o HDL-c, menor o risco; logo, devemos aumentar o HDL-c’.",
"A primeira parte é uma associação (HDL-c como marcador de risco; referência > 40 mg/dL); a segunda é uma conclusão terapêutica não sustentada. O HDL-c mede o colesterol dentro da partícula, não o fluxo do transporte reverso nem a função da HDL; a randomização mendeliana não mostra menor risco em quem tem HDL-c geneticamente alto; terapias que elevam o HDL-c não reduziram eventos; a Diretriz recomenda contra tratamento farmacológico para elevá-lo. O tratamento mira o LDL-c (alvo primário) e o não-HDL-c (coprimário).",
["Associação ≠ intervenção","HDL-c marcador, sem meta","Fármacos não reduziram eventos","Alvo: LDL-c e não-HDL-c"],{s:"P"});
O(7,"Por que TG ≥ 500 mg/dL preocupam? Cite o mecanismo, o tratamento e as causas a investigar.",
"Risco de pancreatite aguda, complicação grave e evitável. Mecanismo aceito: hidrólise local do excesso de TG nos capilares pancreáticos libera ácidos graxos livres em concentração tóxica, lesando o pâncreas. Tratamento: reduzir TG (fibratos), mantendo-os < 500. Investigar causas: diabetes descompensado, álcool, obesidade/resistência à insulina, doença renal, fármacos e distúrbios genéticos. Na hiperquilomicronemia (defeito de LPL ou ApoC-II), os quilomícrons não são hidrolisados: TG muito altos, soro leitoso, dor abdominal recorrente e pancreatite.",
["Pancreatite","AG livres tóxicos","Fibratos","Causas secundárias","Hiperquilomicronemia"],{s:"A"});
O(7,"Explique o que é o não-HDL-c e por que é útil quando os TG estão elevados.",
"Não-HDL-c = CT − HDL-c: colesterol de todas as lipoproteínas aterogênicas (LDL, VLDL, IDL, remanescentes de quilomícrons e Lp(a)); é a meta coprimária (30 mg/dL acima da meta de LDL-c). Útil com TG altos porque o LDL-c é estimado e perde precisão (Friedewald inválida com TG ≥ 400; Martin/Hopkins pode subestimar com TG > 800); o não-HDL-c é obtido por subtração de duas medidas diretas, sem equação nem jejum, e inclui o colesterol das partículas ricas em TG que o LDL-c deixaria de fora.",
["CT − HDL-c","Todas as partículas aterogênicas","Independe de fórmula e jejum","Meta = LDL + 30"],{s:"A"});
O(7,"Mulher de 45 anos, assintomática; sem jejum: CT 280, HDL-c 48, TG 160, LDL-c 198 (Martin/Hopkins), confirmado em 2ª dosagem; pai com infarto aos 50 anos; espessamento nodular dos tendões de Aquiles; TSH, glicemia, função renal e enzimas hepáticas normais. (a) Não-HDL-c e TG? (b) Hipótese e relevância dos exames normais? (c) Exames e conduta familiar?",
"a) Não-HDL-c = 280 − 48 = 232 mg/dL. TG 160 sem jejum está dentro do desejável (< 175); em jejum já seria alto (limite 150). b) Hipercolesterolemia familiar: LDL-c muito alto, persistente e desproporcional ao perfil (TG e HDL-c normais), xantomas tendíneos e história familiar de doença cardiovascular precoce. Exames normais afastam causas secundárias (hipotireoidismo, diabetes, doença renal/nefrótica, colestase), pois deve-se procurá-las antes de chamar de primária. c) Checklist com pontuação da diretriz e análise complementar; teste genético (LDLR, APOB, PCSK9); Lp(a)/ApoB; rastreamento em cascata com perfil lipídico em familiares de 1º grau, inclusive jovens; considerar alto risco para definir a meta e orientar estilo de vida/tratamento.",
["Não-HDL-c = 232","TG dentro do limite sem jejum","HF: LDL alto, xantomas, história familiar","Excluir causas secundárias","Rastreamento em cascata"],{s:"A",c:1});
O(7,"Papel do fígado no metabolismo lipídico, e correlação das lipoproteínas 1, 5, 8 e 10 (quilomícron, VLDL, LDL, HDL) com sua constituição.",
"Fígado: capta remanescentes de quilomícron (colesterol para membranas e ácidos biliares ou excreção na bile); sintetiza VLDL (ApoB-100) com AG e remanescentes; participa da conversão IDL → LDL (lipase hepática); capta colesterol da HDL (SR-BI) no transporte reverso e o excreta na bile; produz bile (sais biliares) que emulsifica gordura. Correlação: quilomícron (1) = 85–95% de TG alimentar, 1–2% proteínas; VLDL (5) = 50% TG, 40% colesterol e fosfolipídeos, 10% proteínas; LDL (8) = a que mais transporta colesterol para locais de função fisiológica (ex.: esteroides); HDL (10) = 50% proteínas. Regra: quanto mais lipídeo, menos densa (quilomícron < VLDL < LDL < HDL).",
["Remanescentes, VLDL, lipase hepática, SR-BI, bile","Quilomícron: 85–95% TG","VLDL: 50% TG","HDL: 50% proteínas","Regra de densidade"],{s:"P"});
