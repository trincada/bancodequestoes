O(8,"Mulher com 34 dias desde a DUM (≈ 25 dias de idade gestacional) faz teste de gravidez. (a) Se negativo: diagnóstico de não gravidez ou possível falso-negativo? (b) O primeiro valor foi 18 mIU/mL; se grávida, qual o comportamento esperado na repetição 48 h depois?",
"a) Pode ser falso-negativo: teste muito precoce pode estar abaixo da sensibilidade (corte ≈ 25 UI); o momento de positivação varia e não há dia universal; um valor de 18, com corte 25, está na faixa indeterminada (5–25) e não define nada → repetir (na unidade, em ~1 semana para teste urinário; no seriado, em 48 h). b) Espera-se aumento do valor (tendência crescente). A ideia de ‘dobrar a cada dois dias’ não é mais admissível; o slide cita aumento mínimo ≈ 35% em 48 h. Fazer no mesmo laboratório e método.",
["Falso-negativo por exame precoce","18 = indeterminado (5–25)","Repetir","Tendência de aumento (mín. ≈ 35%)","Mesmo laboratório"],{s:"A"});
O(8,"Mary (atraso de 5 dias) tem β-hCG sérico de 50 mIU/mL, mas o teste de urina na unidade deu negativo. Explique por que isso é possível e o que concluir.",
"O hCG aparece antes no sangue do que na urina, pois a urina depende de filtração e excreção; o teste urinário só positiva quando a concentração atinge a sensibilidade (≈ 20–25 UI, conforme fabricante). A concentração urinária pode ser bem menor que a do sangue, e a urina diluída também reduz. Acima de 25 UI no sangue é compatível com gestação, sempre somado a clínica (atraso, sintomas) e ultrassonografia. O teste urinário negativo não exclui gestação.",
["Sangue antes da urina","Sensibilidade ≈ 20–25 UI","Urina pode ser mais baixa/diluída","Somar clínica e US"],{s:"A"});
O(8,"Diferencie diagnóstico de probabilidade e de certeza de gestação.",
"Probabilidade: teste de gravidez positivo (mesmo quantitativo, níveis aumentados), com sinais e sintomas típicos e atraso menstrual. Certeza: teste positivo (ou β-hCG compatível) + saco gestacional visto na ultrassonografia (+ clínica). O β-hCG não é analisado isoladamente: ‘tudo isso somado’ define a gestação.",
["Probabilidade = teste + clínica","Certeza = β-hCG + saco gestacional na US","Nunca valor isolado"],{s:"T"});
O(8,"Explique o raciocínio diante de β-hCG positivo com ultrassonografia sem saco gestacional (ex.: β-hCG de 820 UI/L, paciente estável). Inclua a zona discriminatória e o papel do seriado.",
"Não se diagnostica ectópica (‘hipótese alguma’): o β positivo não diz onde está a gestação; trata-se de gestação de localização desconhecida (pode até ser normal). Conduta: β-hCG seriado a cada 48 h, no mesmo laboratório, observar sinais e sintomas (sangramento, queda do β) e repetir a US conforme evolução; β-hCG + US + clínica definem gestação viável ou não. A zona discriminatória (clássica 1.500–2.000 UI/L; conservadora ≈ 3.500) não é regra absoluta; US sem saco acima desse valor não autoriza, isoladamente, o diagnóstico de ectópica, e não se trata com base em um β e uma US isoladas. A ectópica também produz β-hCG.",
["Localização desconhecida","Seriado 48 h","Zona discriminatória não é absoluta","Não tratar com β e US isolados"],{s:"A"});
O(8,"Quais as causas de β-hCG que não normaliza ou está elevado sem gestação em evolução? Cite exemplos de falso-negativo.",
"Em queda: abortamento (ou DTG se não normaliza); platô: ex. gestação ectópica; mantido/crescente/muito elevado: doença trofoblástica gestacional, hCG exógeno, medicamentos com gonadotrofina, malignidades (tumores de células germinativas de ovário e testículo; alguns não trofoblásticos). Outras: perda gestacional recente, perimenopausa/pós-menopausa (hipofisário), doença renal crônica, anticorpos heterófilos (sérico+, urina−). Falso-negativo: exame muito precoce, urina diluída, erro pré-analítico (sem atraso), erros analíticos/interpretação (linha C), efeito gancho (mola, gestação múltipla) ou excesso de fragmento β-core. Persistência inexplicada: confirmar e investigar antes de procedimentos invasivos.",
["Queda: aborto/DTG","Platô: ectópica","Elevado: DTG, hCG exógeno, tumores","Heterófilos","Falso-negativo: precoce, diluída, gancho"],{s:"T"});
O(8,"Descreva a dinâmica do β-hCG na gestação normal e por que não serve para datar a gestação.",
"Aumento após a implantação (duplicação inicial ≈ 1,4–2,1 dias, segundo o slide), pico entre 8 e 10 semanas (≈ 50.000–100.000 UI/L), depois redução quando progesterona e estrogênios assumem a manutenção, com queda e platô (≈ 10.000–20.000 UI/L) a partir de 18–20 semanas (fala: 20ª–24ª), estável até o termo. Não zera. O nível depende de quando houve fecundação e varia entre mulheres e entre gestações; há sobreposição entre idades gestacionais; a gestação gemelar tem valores maiores. A idade gestacional é dada pela DUM e pela US.",
["Aumento → pico 8–10 sem → queda e platô","Não zera","Variação e sobreposição","DUM + US datam"],{s:"T"});
O(8,"Explique como funciona a fita imunocromatográfica de gravidez e como interpretar as linhas T e C.",
"Molha-se a fita na urina, descarta-se o excesso e lê-se em 5 a 10 minutos. ‘Imuno’: a fita tem anticorpos anti-β-hCG; o β-hCG da urina (antígeno) forma complexo. ‘Cromatográfico’: o líquido corre pela fase sólida; o complexo é capturado na linha T (anticorpo ligado a substância que dá cor). A linha C (controle) deve estar sempre positiva. Só C = negativo; T e C = positivo (> 25 UI: T ‘bem vermelha’); T tênue/rosada = indefinido → repetir em 1 semana; sem C = inválido.",
["Anticorpos anti-β-hCG","Linha T = teste; C = controle","Só C: negativo","T tênue: repetir","Sem C: inválido"],{s:"T"});

O(9,"Paciente primigesta, Rh negativo, esposo Rh positivo, foi orientada a fazer o teste de Coombs e a profilaxia com anti-D. (a) Qual Coombs deve ser feito na gestante Rh− e qual sua finalidade? (b) Qual o princípio da profilaxia com anti-D?",
"a) Coombs INDIRETO: pesquisa anticorpos irregulares (anti-Rh) no soro da mãe — soro da mãe + hemácias de doador O positivo lavadas; se houver anticorpo, liga-se às hemácias e o soro de Coombs (anti-imunoglobulina humana) provoca aglutinação. Finalidade: saber se já está aloimunizada (positivo → alto risco, titulação; crítico 1:16); negativo → ainda não sensibilizada → profilaxia. b) A imunoglobulina anti-D (300 µg IM, 28ª–34ª semana e em até 72 h após o parto se RN Rh+) liga-se às hemácias Rh+ do feto que chegam à circulação materna e as elimina antes que o sistema imune da mãe reconheça o antígeno D e produza anti-D. É preventiva: não funciona se a mãe já produziu anti-D.",
["Coombs indireto","Soro materno + hemácias O positivo","Positivo = aloimunizada","Anti-D elimina hemácias fetais antes do reconhecimento","Preventiva"],{s:"P"});
O(9,"Explique passo a passo por que a DHPN ocorre a partir da 2ª gestação em mulher Rh− com feto Rh+ sem imunoprevenção. Por que a passagem de IgG cresce a partir do 2º trimestre?",
"Mãe Rh− (dd) com feto Rh+ herdado do pai: hemácias fetais passam para a circulação materna (gestação ou parto). 1ª gestação: o antígeno estimula a mãe a produzir IgM anti-Rh, de alto peso molecular, que não atravessa a placenta → sem risco ao feto. 2ª gestação em diante: nova exposição → IgG anti-Rh, que atravessa a barreira hemato-placentária, liga-se às hemácias Rh+ do bebê e causa hemólise ainda intraútero (hipersensibilidade tipo II). A passagem aumenta no 2º trimestre porque antes o feto é muito pequeno e produz volume mínimo de sangue; depois há mais sangue fetal e maior escape para a circulação materna.",
["IgM na 1ª, não atravessa","IgG nas seguintes, atravessa","Hemólise intraútero","2º trimestre: mais sangue fetal"],{s:"A"});
O(9,"Por que D fraco e D parcial são problemas na tipagem sanguínea e como se manejam na gestante (profilaxia)?",
["D fraco tem baixa expressão do antígeno D (pode ser lido como Rh negativo); D parcial tem epítopos alterados/faltantes e pode ter forte reatividade ou nenhuma com o anti-D; são os maiores responsáveis por erros de tipagem, sobretudo na tipagem em ponta de dedo e em laboratórios ambulatoriais que liberam a tipagem em tubo. Na gestante: D fraco subtipos 1, 2, 3 (maioria) não produzem anti-D e não precisam de profilaxia; subtipos incomuns (ex.: 11, 15) aloimunizam; D parcial costuma ser rotulada Rh+ mas pode ser aloimunizada e deve receber anti-D. No Brasil, D fraco é tratado como Rh+ e D parcial/DEL como Rh−; o ACOG recomenda anti-D no D fraco, exceto subtipos 1–3 na genotipagem. Na emergência, sem genotipagem, a gestante D fraco que precisa de sangue recebe Rh negativo e depois anti-D (maternidade citada)."].join(""),

O(9,"Gestante Rh− O negativo, primigesta, 10 semanas, parceiro A Rh+, Coombs indireto negativo. Há risco de aloimunização? Qual a conduta ao longo da gestação e após o parto?",
"Sim (pai Rh+ → feto pode ser Rh+). Conduta: repetir Coombs indireto com 28 semanas (antes da imunoglobulina); se continuar negativo, anti-D 300 µg IM entre 28ª e 34ª semana; após o parto, nova dose em até 72 h (no máximo 28 dias) se o RN for Rh+ (RN Rh− dispensa). Também 300 µg em até 72 h após eventos sensibilizantes (aborto, ectópica, mola, sangramento, trauma, procedimentos fetais, versão cefálica externa). Opcionalmente, genotipagem RHD fetal por DNA fetal livre (feto Rh− → rotina, sem imunoglobulina).",
["Coombs indireto aos 28 sem","Anti-D 300 µg 28ª–34ª","Pós-parto em até 72 h se RN Rh+","Eventos sensibilizantes"],{s:"T"});
O(9,"Gestante sensibilizada com Coombs indireto positivo: descreva o fluxo de conduta (título, Doppler da ACM, cordocentese e transfusão intrauterina).",
"1) Painel de anticorpos irregulares + titulação (painel só em banco de sangue). 2) Anticorpo sem hemólise: pré-natal de rotina; com hemólise prévia (feto/RN acometido) ou anti-Kell: direto ao Doppler. 3) Título < 1:16: Coombs 1×/mês até 24 sem e quinzenal de 24 a 36 sem; parto com 37–38 sem; título ≥ 1:16 (crítico): Doppler da PVS-ACM a partir de 18–20 sem, a cada 2 semanas. 4) PVS-ACM ≤ 1,5 MoM: repetir a cada 1–2 sem até o parto (37–38 sem); > 1,5 MoM (sugere anemia fetal): > 34 sem resolver a gestação; < 34 sem cordocentese: Ht < 30% (ou Hb > 2 DP abaixo) → transfusão intrauterina; sem anemia → repetir em 1–2 sem. Exames adicionais: US (alteração placentária, hepatomegalia) e cardiotocografia. Anti-D não tem mais indicação.",
["Painel + titulação","Título < 1:16 × ≥ 1:16","Doppler da ACM > 1,5 MoM","Cordocentese: Ht < 30% → transfusão","> 34 sem: resolver"],{s:"T"});
O(9,"Explique a icterícia do RN na DHPN: via de formação da bilirrubina, por que fica alta, por que a urina é clara e a diferença para a icterícia fisiológica.",
"Hemólise libera hemoglobina → heme → biliverdina → bilirrubina indireta (lipossolúvel), que segue ao fígado para ser conjugada (glicuroniltransferase) em bilirrubina direta (hidrossolúvel, excretada pela bile e rins). Intraútero o fígado materno conjugava; após o nascimento o fígado do RN é imaturo (pior no prematuro) e a circulação está aumentada, então a BI continua alta e atravessa a barreira hematoencefálica, sendo tóxica ao SNC (kernicterus). A BI não é excretada (não é hidrossolúvel): a urina é clara; só fica colúrica quando a BD está aumentada (ex.: hepatites virais). Fisiológica: transitória, pico ≈ 7 mg/dL entre o 3º e o 5º dia; icterícia nas primeiras 48 h ou BI > ≈ 10 mg/dL no RN a termo é alta, com patamar para fototerapia; hipóxia no parto estimula eritropoetina → mais hemólise → mais BI.",
["Heme → biliverdina → BI","Fígado imaturo","BI neurotóxica","Urina clara (BI)","Fisiológica × patológica"],{s:"T"});

O(10,"Descreva a interpretação da sorologia da toxoplasmose na gestante (as quatro combinações de IgG e IgM), o papel da avidez e a conduta (espiramicina, amniocentese, tratamento específico).",
"IgG−/IgM− = não tem toxoplasmose, suscetível: repetir periodicamente. IgG+/IgM− = infecção pregressa. IgG−/IgM+ = infecção muito recente ou IgM falso-positivo → espiramicina → repetir em 2 a 3 semanas; se IgG positivou, soroconversão. IgG+/IgM+ = provável infecção aguda → afastar IgM residual (métodos modernos detectam IgM por meses) → avidez de IgG. Avidez: primeiro baixa avidez, depois alta; alta indica infecção há > 12–16 semanas (feita na mesma amostra, até 16 semanas de gestação, no mesmo laboratório); baixa/intermediária não confirma infecção recente, mas conduz como possível aguda. Conduta (MS 2022): infecção aguda/provável até 16 semanas: espiramicina (evita passagem dos taquizoítas pela placenta); após 16 semanas ou infecção fetal: tratamento específico; amniocentese com biologia molecular após 18 semanas e > 4 semanas da infecção; 3º trimestre: sem procedimento invasivo, apenas trata; US fetal mensal/bimensal; pré-natal de alto risco e investigação completa do RN.",
["4 combinações IgG/IgM","IgM residual → avidez","Alta avidez = > 12–16 semanas","Espiramicina até 16 sem","Amniocentese após 18 sem e > 4 sem"],{s:"A"});
O(10,"Explique os fatores que determinam o risco de transmissão da toxoplasmose ao feto e as manifestações (tétrade de Sabin). Como se previne?",
"A transmissão aumenta com a idade gestacional (≈ 15% às 13 semanas; 45% às 26; 70% às 36), mas a doença fetal é mais grave quando a infecção é precoce. Tétrade de Sabin: retinocoroidite (inflamação da retina), calcificações cerebrais (pontos brancos na imagem), perturbações neurológicas, microcefalia e hidrocefalia. Prevenção: evitar carne crua ou malpassada, água não tratada, vegetais mal lavados e fezes de gato (caixa de areia, pelagem); lavar as mãos; orientar todas as gestantes; sorologia seriada nas suscetíveis. Ciclo: gato (hospedeiro definitivo) elimina oocistos nas fezes; em 1–5 dias esporulam; contaminam hospedeiros intermediários e o ambiente.",
["Transmissão ↑ com a idade gestacional","Doença mais grave se precoce","Tétrade de Sabin","Prevenção: carne, água, vegetais, gato"],{s:"A"});
O(10,"Explique a rubéola na gestação: consequências, síndrome da rubéola congênita, risco por trimestre, diagnóstico, prevenção e por que não há tratamento.",
"Infecção viral aguda, normalmente benigna; na gestante há risco de transmissão transplacentária: aborto espontâneo, natimorto, parto prematuro, RN com anomalias simples ou combinadas. Síndrome da rubéola congênita: surdez, catarata ou glaucoma, malformações cardíacas (PCA e estenose pulmonar) e retardo mental; retinopatia ‘sal e pimenta’. Risco: ≈ 81% no 1º trimestre, ≈ 25% no 2º, até 100% após 36 semanas. Diagnóstico: IgG na gestante, avidez de IgG para datar a infecção; PCR em vilo corial ou líquido amniótico. Prevenção: vacinação antes de engravidar, aguardando intervalo (slide: 28 dias); vacina contraindicada na gestação. Não existe tratamento intrauterino eficaz. Notificação compulsória.",
["Consequências e síndrome","81% / 25% / até 100%","IgG + avidez; PCR","Vacina antes de engravidar","Sem tratamento intrauterino"],{s:"T"});
O(10,"Explique o CMV congênito: características do vírus, manifestações, sequelas, diagnóstico padrão-ouro e seguimento.",
"Vírus de DNA, herpesvírus; células grandes com inclusões intranucleares (e citoplasmáticas), que não são o vírus. Transmissão pré-natal, no parto (secreções genitais) e pós-natal precoce (leite). 10–15% sintomáticos ao nascimento; manifestações: coriorretinite, microcefalia, hepatoesplenomegalia, hidrocefalia; tardias: deficiência visual, perda auditiva, deficiência intelectual. Sequelas em 40–60% dos sintomáticos e 10–15% dos assintomáticos, sobretudo perda auditiva neurossensorial tardia e progressiva. Padrão-ouro: PCR do DNA viral na urina ou saliva do RN nas primeiras 3 semanas. RN sintomático recebe antiviral (valganciclovir 6 meses, slide); no 1º trimestre pode-se fazer amniocentese; seguimento com audiometria seriada.",
["Herpesvírus de DNA; inclusões","Manifestações e sequelas","PCR na urina/saliva em 3 semanas","Antiviral; audiometria seriada"],{s:"T"});
O(10,"Explique o HTLV-1/2 na gestação (por que rastrear, transmissão e conduta) e o Zika (transmissão, diagnóstico, espera para conceber e achados no bebê).",
"HTLV: retrovírus com infecção por toda a vida, associado a leucemia/linfoma de células T do adulto e mielopatia; transmissão vertical principalmente pelo aleitamento; sem intervenção ~20% dos filhos se infectam; suspender a amamentação previne ~80%. Triagem na 1ª consulta; positivo → confirmar (Western blot ou biologia molecular); confirmado: não amamentar (cabergolina e fórmula), cesariana, sorologia da criança a partir de 18 meses; notificação compulsória. Zika: Aedes aegypti, vertical e sexual; casais devem aguardar ≥ 3 meses (homem infectado) e ≥ 2 meses (mulher) — antes 6 meses; o homem elimina o vírus no sêmen; RT-PCR na fase aguda (até 5 dias do início dos sintomas) ou sorologias; bebê: microcefalia com calcificações, retina e catarata, alterações de membros.",
["HTLV: aleitamento; não amamentar","Cesariana; sorologia aos 18 meses","Zika: Aedes, sexual, vertical","Espera 3/2 meses","RT-PCR até 5 dias; microcefalia"],{s:"T"});
O(10,"Explique o herpes simples neonatal: transmissão, apresentação, diagnóstico e prevenção.",
"Transmitido em geral durante o parto, pelo canal vaginal (risco alto no parto); mais grave em prematuros nas UTIs. Sinal típico: erupção vesicular (‘quase uma bolha só’), que pode progredir para forma disseminada (hepatite, pneumonite, CIVD, com ou sem encefalite); outros sinais: instabilidade térmica, letargia, hipotonia, apneia, convulsões; as bolhas rompem e pode haver infecção bacteriana secundária. Diagnóstico: clínico + PCR do conteúdo das vesículas (no RN também sangue e líquor); a sorologia não ajuda, por isso não há rastreamento sorológico. Prevenção: avaliar a gestante, observar lesões extragenitais e comunicar a equipe pediátrica. HSV-1 e 2 sem separar ‘oral’ e ‘genital’.",
["Transmissão no parto","Vesículas; forma disseminada","PCR da vesícula; sorologia não ajuda","Prevenção: avaliar mãe e avisar pediatria"],{s:"T"});
O(10,"Responda: (a) Que situação pode causar falso-positivo para sífilis? (b) O que é cicatriz sorológica? (c) O que é o fenômeno prozona? (d) Que paciente é mais suscetível à neurossífilis? Aplique ao caso de VDRL 1:32 com FTA-ABS não reagente.",
"a) Doenças autoimunes, como lúpus e síndrome do anticorpo antifosfolipídico (SAF). b) Paciente tratado corretamente que mantém VDRL baixo (1:1, 1:2, até 1:4), às vezes pela vida toda; só se define com a história (diagnóstico + tratamento adequado + queda ≥ 2 títulos + acompanhamento); vale para VDRL, não para o FTA-ABS. c) Excesso de anticorpos: o antígeno do VDRL não basta para flocular a amostra pura → resultado falsamente negativo; por isso se fazem diluições (pelo menos 1:16 ou 1:32). d) Imunodeprimidos (HIV + sífilis tende a quadros mais severos, inclusive neurossífilis meningovascular). Caso: VDRL 1:32 com FTA-ABS não reagente = falso-positivo do não treponêmico (anticardiolipina por outra causa); o treponêmico muito sensível, não reagente, descarta sífilis.",
["Autoimunes/SAF","Cicatriz: VDRL baixo após tratamento","Prozona: falso-negativo, diluir","Imunodeprimidos","FTA-ABS não reagente descarta"],{s:"A",c:1});
O(10,"Descreva o rastreamento e a conduta no pré-natal, na admissão para o parto e no RN para as infecções congênitas (sífilis, HIV, hepatites B e C, HTLV, toxoplasmose).",
"1ª consulta: sífilis, HIV, hepatite B (antígeno e anticorpo), hepatite C (testagem universal), HTLV-1/2, toxoplasmose IgG e IgM; ‘teste da mamãe’ (1ª fase, 15 exames; 2ª fase a partir da 24ª semana) varia conforme a região e inclui rubéola e CMV; repetem-se toxoplasmose IgM (se suscetível), sífilis e HIV. Sífilis: 1ª consulta, início do 3º trimestre, parto/aborto, exposição de risco. HIV: 1ª consulta, 3º trimestre, parto (teste rápido). Hepatite B: 1ª consulta; no parto se não testada ou vacinação incompleta (vacinar se suscetível). Toxoplasmose suscetível: mensal (ideal) ou a cada 3 meses; parto; 2–4 semanas após. Na admissão: sífilis, HIV, hepatite C e B (se indicado). RN: mãe HIV+ → antirretroviral; hepatite B → vacina em 12 h + imunoglobulina; HIV ou HTLV → não amamentar; RN com sífilis, toxoplasmose ou CMV → tratamento e neonatologista; teste do pezinho 2–3 dias após o parto (SUS: antes da alta); follow-up por 2 anos.",
["Tabela da 1ª consulta","Repetições","Admissão para parto","Condutas no RN","Pezinho"],{s:"T"});

O(11,"Caracterize as quatro fases da sífilis (primária, secundária, latente, terciária) quanto a tempo, lesão e exame diagnóstico.",
"Primária: incubação 10–90 dias (média 3 semanas); cancro duro no local de entrada (bordos definidos, seco, fundo limpo, indolor, linfadenopatia regional), dura 3–8 semanas e some sozinho; sorologia ainda sem anticorpos → pesquisa direta em campo escuro. Secundária: 6 semanas a 6 meses após cicatrizar o cancro; bactéria disseminada; roséola sifilítica (tronco, raiz dos membros, palmas e plantas, não pruriginosa), condilomas, alopecia em clareira, madarose, uveíte, neurossífilis; regride em 4–12 semanas; diagnóstico por sorologia (treponêmico + VDRL). Latente: sem sinais nem sintomas; recente até 1 ano, tardia > 1 ano; só sorologia. Terciária: 1 a 40 anos depois, 15–25% dos não tratados; gomas (liquefação de tecido/osso), cardiovascular e neurológica; FTA-ABS reagente + VDRL de título baixo.",
["Primária: cancro duro; campo escuro","Secundária: roséola; sorologia","Latente: recente × tardia","Terciária: goma; 1–40 anos; 15–25%"],{s:"T"});
O(11,"Compare testes não treponêmicos e treponêmicos (o que detectam, exemplos, vantagens, limitações) e explique como interpretar uma discordância (VDRL alto com FTA-ABS não reagente).",
"Não treponêmicos (VDRL, RPR): detectam anticorpos anticardiolipina (parede do treponema e membrana humana, formados por destruição de tecido); quantificam (título); usados no seguimento; falso-positivo em doenças autoimunes (lúpus, SAF). Treponêmicos (teste rápido, FTA-ABS, ELISA e derivados): anticorpos antitreponêmicos (reagem com outras espécies de Treponema, pois o T. pallidum não é cultivável); mais sensíveis, primeiros a positivar; ficam positivos pela vida toda, tratado ou não; resultado reagente/não reagente por cut-off. Confirmam o diagnóstico: treponêmico reagente + não treponêmico reagente. VDRL alto com FTA-ABS não reagente: sífilis descartada (treponêmico muito sensível); o VDRL alto é anticardiolipina por outra causa (SAF, autoimune) — exemplo da sobrinha do professor com SAF e VDRL 1:64–1:128.",
["Anticardiolipina × antitreponêmico","Quantifica × qualitativo","Treponêmico fica para sempre","Discordância: falso-positivo"],{s:"T"});
O(11,"Explique a titulação do VDRL, o fenômeno de prozona, o critério de resposta ao tratamento, a cicatriz sorológica e a reinfecção.",
"Titulação: soro + antígeno cardiolipínico em placa; diluições seriadas na razão 2 (1:1, 1:2, 1:4, 1:8, 1:16…); título = última diluição que ainda flocula; floculação lida ao microscópio após 5 min de agitação (visual, depende de experiência; mesma lógica do Coombs indireto). Prozona: com título muito alto, o antígeno não é suficiente para flocular a amostra pura → falso-negativo; por isso sempre se fazem diluições (até 1:16 ou 1:32) e segue-se até o título final. Resposta ao tratamento: queda de ≥ 2 títulos (ex.: 1:128 → 1:32); só ≥ 2 diluições contam, pois 1 diluição pode ser variação do método. Cicatriz sorológica: paciente tratado corretamente que mantém VDRL baixo (1:1–1:4), às vezes pela vida toda; exige história (diagnóstico + tratamento adequado + queda ≥ 2 títulos + acompanhamento); vale para o VDRL, não para o FTA-ABS. Reinfecção: a sífilis não gera imunidade; aumento ≥ 2 títulos = reinfecção ou recrudescimento por tratamento inadequado.",
["Razão 2; última diluição que flocula","Prozona: falso-negativo, diluir","Queda ≥ 2 títulos","Cicatriz exige história","Reinfecção: aumento ≥ 2"],{s:"T"});
O(11,"Descreva como se interpretam as sorologias do RN de mãe com sífilis e quais os critérios para definir sífilis congênita.",
"Ao nascimento o RN pode ter treponêmico e não treponêmico reagentes só por anticorpos maternos que atravessaram a placenta; por isso comparam-se os títulos (sangue periférico do RN colhido ao mesmo tempo que o da mãe) e acompanha-se o bebê. Mesmo título da mãe: sem significado isolado; repetir após 48 h. 1 diluição a mais: não afirma congênita (leitura visual); ≥ 2 diluições acima do materno (ex.: mãe 1:4, RN 1:16): sífilis congênita. Títulos crescentes (128 → 256 → 512): congênita. Título em queda (1:32 após 48 h): anticorpos maternos. Treponêmico reagente após 18 meses: anticorpos do próprio bebê → congênita (em crianças maiores, afastar violência sexual); não treponêmico reagente após 6 meses também. Critérios: (1) criança/aborto/natimorto de mãe com sífilis não tratada ou inadequadamente tratada; (2) < 13 anos com evidência sorológica; (3) não treponêmico reagente + evidência clínica, liquórica ou radiológica.",
["Anticorpos maternos × produção própria","≥ 2 diluições acima da mãe","Títulos ascendentes","Treponêmico após 18 meses","Três critérios"],{s:"A"});
O(11,"Descreva as manifestações da sífilis congênita precoce e tardia e a conduta no RN com sofrimento respiratório, lesões cutâneas e mãe sabidamente com sífilis.",
"Precoce: óbito fetal/aborto, prematuridade, baixo peso; hepatomegalia, icterícia, esplenomegalia, linfadenopatia; pênfigo palmo-plantar ou condiloma plano; acometimento ósseo; sofrimento respiratório; anemia, trombocitopenia, leucocitose (reação leucemoide) ou leucopenia; também fissura perioral, síndrome nefrótica, hidropsia, convulsão, meningite. Tardia (após 18 meses; slide: após o 2º ano): tíbia em sabre, articulações de Clutton, nariz em sela, arco palatino elevado; incisivos medianos deformados e molares em amora; ceratite intersticial; surdez neurológica; dificuldade de aprendizado. Conduta: colher sangue para VDRL (confirma infecção materna); com esse quadro o neonatologista inicia o tratamento e o bebê vai para a UTI; reação leucemoide normaliza com tratamento.",
["Precoce: pele, fígado, ossos, hematológico","Tardia: ossos, dentes, olho, surdez","Conduta: VDRL; tratar; UTI"],{s:"T"});
O(11,"Explique como se faz a pesquisa direta do T. pallidum na lesão primária e discuta seu valor atual.",
"Passos: (1) limpar com SF estéril (se houver secreção purulenta, fazer lâmina e Gram); (2) éter como anestésico local, que não interfere no exame; (3) pinçar a base da lesão (a lesão é indolor, mas a coleta é muito dolorosa); (4) escarificar o fundo ‘fazendo a ferida chorar’ → linfa rica em treponema; (5) observar entre lâmina e lamínula em campo escuro (morfologia de espiroqueta e movimentação). Alternativa: coloração de Fontana-Tribondeau (sais de prata) em microscopia óptica. Positivo afirma lesão primária por sífilis; negativo não exclui. Nesta fase ainda não há anticorpos. Foi usado nas décadas de 80/90; hoje não se usa na prática (decide-se por epidemiologia, clínica e histórico e trata-se), mas é método de detecção descrito no manual de IST e pode cair em prova.",
["Limpar, éter, pinçar, escarificar, campo escuro","Positivo afirma; negativo não exclui","Fontana-Tribondeau","Pouco usado hoje"],{s:"T"});

O(12,"Explique o mecanismo do aumento do VHS na inflamação e por que o exame é inespecífico. Cite fatores que o aumentam e diminuem.",
"Inflamação → o fígado produz mais fibrinogênio e outras proteínas de fase aguda → o fibrinogênio neutraliza as cargas negativas da superfície das hemácias (que normalmente se repelem) → empilhamento (rouleaux) → sedimentam mais rápido → VHS ↑ (medido em 1 hora no tubo em pé). PCR elevada acompanha a inflamação e o VHS. Anemia (poucas hemácias) costuma aumentar; poliglobulia costuma diminuir; forma, tamanho e número das hemácias alteram o VHS. É inespecífico: sobe em infecção, inflamação e tumor, sem dizer a causa; por isso não é ‘altamente específico e indispensável’.",
["Fibrinogênio neutraliza cargas","Rouleaux → sedimenta mais","Anemia ↑ / poliglobulia ↓","Inespecífico"],{s:"A"});
O(12,"Explique o que é a PCR: origem, regulação, função, comportamento nas infecções bacterianas e especificidade.",
"Proteína de fase aguda produzida no fígado, sob estímulo da IL-6 (principal regulador da resposta inflamatória), em resposta a infecção, necrose ou inflamação. É uma pentraxina: ativa o complemento e estimula macrófagos e outras células à fagocitose (imunidade inata). Sobe cedo e aumenta nas infecções bacterianas (a afirmativa de que é mais baixa na infecção bacteriana está errada). É pouco específica: sobe em muitas doenças inflamatórias e necróticas; indica inflamação, mas não onde nem por quê.",
["Fígado; IL-6","Pentraxina: complemento e fagocitose","Sobe em bactéria","Pouco específica"],{s:"A"});
O(12,"Descreva o espermograma: origem dos componentes do sêmen, condições de coleta e os pontos que a prova considerou corretos e incorretos.",
"Sêmen: espermatozoides do epidídimo + secreção da vesícula seminal (fonte da frutose, que gera ATP para a energia e a locomoção dos espermatozoides) + secreção prostática + secreção da glândula bulbouretral. Coleta ideal: masturbação em frasco próprio (coito interrompido não vale); abstinência de 2 a 7 dias; febre alta pode alterar o resultado; a confirmação exige novas amostras com intervalo maior (semanas), não ‘duas amostras com dois dias’; a frutose vem da vesícula seminal, não do líquido prostático. IST (gonorreia, clamídia) aparecem como associadas à infertilidade masculina.",
["Composição do sêmen","Frutose: vesícula seminal → ATP","Masturbação; abstinência 2–7 dias","Febre altera; intervalo de semanas"],{s:"A"});
O(12,"Explique a ordem geral dos marcadores de infarto e qual é o mais específico.",
"Em geral, a mioglobina sobe primeiro (imediato); CK-MB/CPK e troponina sobem em algumas horas (≈ 8–24 h); TGO e outras enzimas sobem mais tarde (24–72 h). A troponina é o marcador mais específico do coração. Não se devem decorar números: usar o gráfico do professor (imediato / 8–24 h / 24–72 h).",
["Mioglobina primeiro","CK-MB e troponina em horas","TGO tardia (24–72 h)","Troponina mais específica"],{s:"T"});

Q(1,"Questão 01","Assinale a opção correta com relação à vascularização do estômago.",[
["A artéria gástrica direita é ramo da artéria hepática comum e cursa sobre a curvatura maior do estômago.","Errada: a gástrica direita segue a curvatura menor."],
["A artéria gástrica esquerda é ramo da artéria esplênica e cursa sobre a curvatura maior do estômago.","Errada: a esquerda vem do tronco celíaco (não da esplênica) e segue a curvatura menor."],
["As artérias gástricas direitas e esquerdas fazem uma anastomose na curvatura menor, ambas são responsáveis pela irrigação da região superior do estômago.","Certa: é a única sem erro de localização. Curvatura menor: gástrica esquerda (ramo direto do tronco celíaco) + gástrica direita (da hepática comum) → arco arterial da curvatura menor. Região superior (cárdia/fundo): gástrica esquerda (+ gástricas curtas, da esplênica)."],
["A parte superior do estômago é irrigada pelas artérias gastromental direita e esquerda.","Errada: as gastromentais irrigam a curvatura maior (direita: da gastroduodenal; esquerda: da esplênica)."]],2,{s:"P"});
Q(1,"Questão 02","Considerando a relação dos órgãos digestórios com o peritônio, assinale a alternativa correta:",[
["O estômago é um órgão totalmente intraperitoneal.","Certa. Intraperitoneais: estômago, 1ª parte do duodeno, jejuno, íleo, ceco, apêndice, cólon transverso, sigmoide, fígado, baço, vesícula."],
["O cólon transverso é retroperitoneal, enquanto o cólon descendente é intraperitoneal.","Errada: trocou os cólons (transverso é intra; descendente é retro)."],
["As 4 partes do duodeno e o reto são intraperitoneais.","Errada: só a 1ª parte do duodeno é intra; o reto é retro/subperitoneal."],
["O jejuno é totalmente retroperitoneal.","Errada: o jejuno é intraperitoneal."]],0,{s:"P"});
Q(1,"Questão 03","Sobre o ligamento de Treitz é correto afirmar:",[
["Marca o limite anatômico entre o cólon transverso e o cólon descendente.","Errada: nada tem a ver com os cólons."],
["Divide a hemorragia digestiva em alta e baixa, estando localizado entre o cólon transverso e o cólon descendente.","Errada: a divisão em alta/baixa existe, mas o local está errado (nada tem a ver com os cólons)."],
["Marca a junção entre o duodeno e o jejuno, sendo o ponto que define hemorragia digestiva em alta (acima) e baixa (abaixo).","Certa: músculo suspensor do duodeno, fixa a flexura duodenojejunal ao diafragma; acima = HDA (esôfago, estômago, duodeno); abaixo = HDB (jejuno, íleo, cólon, reto)."],
["Está localizado entre o cólon ascendente e o ceco, prevenindo refluxo.","Errada: descreve a válvula ileocecal (íleo–ceco), que impede refluxo do ceco para o íleo."]],2,{s:"P"});
Q(1,"Questão 04","A respeito da anatomia das vias biliares e pancreáticas é correto afirmar:",[
["A papila maior do duodeno, também chamada de papila de Santorini, é o ponto de drenagem do ducto pancreático principal.","Errada: a papila maior é a de Vater (Santorini é a papila menor, do ducto pancreático acessório)."],
["O ducto da vesícula biliar é chamado de cístico e desemboca na papila menor do duodeno…","Errada: o cístico não desemboca na papila; une-se ao hepático comum (→ colédoco). (o final desta alternativa está cortado na foto da prova)"],
["O ducto pancreático principal e o colédoco desembocam na papila menor do duodeno em locais distintos…","Errada: Wirsung e colédoco desembocam juntos (ampola hepatopancreática) na papila maior. (o final desta alternativa está cortado na foto da prova)"],
["O ducto da vesícula biliar é chamado de colédoco e desemboca na papila maior do duodeno…","Gabarito da prova: D. Mantém a desembocadura correta (papila maior, 2ª parte do duodeno); como transcrita, porém, chama o ducto da vesícula de “colédoco” (o da vesícula é o cístico). (o final desta alternativa está cortado na foto da prova)"]],3,
{s:"P",obs:"O final das alternativas b, c e d está cortado na foto. O material confirma: ampola de Vater → papila maior (2ª porção do duodeno); Santorini = papila menor (ducto acessório). Confira o texto da D na prova original."});
Q(1,"Questão 05","Os principais vasos linfáticos do corpo humano são conhecidos como ducto linfático direito e ducto torácico. Para onde cada um desses ductos drena?",[
["O ducto linfático direito deságua na veia subclávia direita, enquanto o ducto torácico deságua na veia subclávia esquerda.","Certa. Ducto linfático direito: quadrante superior direito → ângulo venoso direito. Ducto torácico: resto do corpo (~3/4), origem na cisterna do quilo (L1–L2) → ângulo venoso esquerdo."],
["O ducto linfático direito deságua na veia cava inferior, enquanto o ducto torácico deságua na veia cava superior.","Errada: as veias cavas não recebem os ductos diretamente."],
["Ambos os ductos linfáticos deságuam na veia cava superior.","Errada: terminam nos ângulos venosos."],
["Os ductos linfáticos deságuam diretamente na região chamada cisterna do quilo.","Errada: a cisterna do quilo é a origem do ducto torácico, não o destino."]],0,{s:"P"});
Q(1,"Questão 06","Sobre os tipos de vasos linfáticos e suas características anatômicas, assinale a alternativa correta:",[
["Os capilares linfáticos possuem parede formada por uma única camada de células endoteliais e parede fenestrada o que garante a alta permeabilidade.","Errada: o capilar não é fenestrado; a alta permeabilidade vem das junções sobrepostas (válvula de mão única)."],
["Os vasos linfáticos pré-coletores apresentam camada de músculo liso desenvolvida e grande quantidade de valvas verdadeiras.","Errada: pré-coletor é transição, com pouco músculo e poucas valvas."],
["Os vasos linfáticos coletores possuem três túnicas, paredes mais finas que as veias e apresentam valvas verdadeiras ao longo de seu trajeto.","Certa: íntima, média com músculo liso e adventícia; valvas verdadeiras (aspecto em “contas de rosário”)."],
["Os troncos linfáticos são vasos os vasos de maior calibre que recebem a linfa e a devolvem à circulação sanguínea.","Errada: quem devolve a linfa às veias são os ductos (linfático direito e torácico); os troncos levam a linfa aos ductos."]],2,{s:"P",
fig:'<div class="tw"><table class="tbl"><caption>Resumo do gabarito</caption><thead><tr><th>Vaso</th><th>Características</th></tr></thead><tbody><tr><td>Capilares</td><td>Fundo cego; uma camada de endotélio, sem fenestras; sem músculo e sem valvas</td></tr><tr><td>Pré-coletores</td><td>Transição; parede fina, pouco músculo liso, poucas valvas</td></tr><tr><td>Coletores</td><td>3 túnicas; parede mais fina que a das veias; valvas verdadeiras</td></tr><tr><td>Troncos</td><td>Jugular, subclávio, broncomediastinal, lombar, intestinal → levam a linfa aos ductos</td></tr></tbody></table></div>',figAfter:true});
Q(1,"Questão 07","O sistema reprodutor feminino é formado por órgãos internos e externos, a respeito dos órgãos internos é correto afirmar:",[
["A tuba uterina é dividida em parte uterina, istmo e ampola;","Errada: a tuba tem 4 partes — infundíbulo (fímbrias), ampola, istmo e parte uterina; a alternativa omite o infundíbulo."],
["O útero é formado por três camadas, sendo o miométrio a camada mais externa;","Errada: perimétrio (serosa, externa), miométrio (média, músculo liso), endométrio (interna)."],
["A vagina é um órgão ímpar, com formato tubular que se estende do colo do útero até o vestíbulo da vagina;","Certa: tubo fibromuscular ímpar, do colo do útero ao vestíbulo (óstio da vagina)."],
["A estrutura interna dos ovários é composta por um córtex externo e uma medula interna, na medula é o local onde encontramos os folículos","Errada: os folículos ficam no córtex; a medula tem vasos e tecido conjuntivo frouxo."]],2,{s:"P"});
Q(1,"Questão 08","Sobre a anatomia do pudendo feminino, assinale a alternativa correta:",[
["O clitóris é a única estrutura erétil do pudendo feminino, não havendo corpos cavernosos associados.","Errada: o clitóris tem corpos cavernosos D e E e glande; os bulbos do vestíbulo também são tecido erétil."],
["Os pequenos lábios são pregas de tecido adiposo que circundam superficialmente a vulva.","Errada: lábios maiores têm gordura; os menores são pregas cutâneas sem gordura."],
["Os pequenos lábios são pregas musculares responsáveis pela proteção do vestíbulo vaginal.","Errada: nem adiposas nem musculares."],
["O vestíbulo vaginal abriga o óstio externo da uretra e o óstio da vagina.","Certa: espaço entre os lábios menores, com o óstio externo da uretra, o óstio da vagina e as aberturas das glândulas vestibulares."]],3,{s:"P",tag:"Não é desse semestre"});
Q(1,"Questão 09","A respeito do sistema muscular, analise as afirmativas e assinale a alternativa correta:",[
["Os músculos podem inserir-se por mais de um tendão em sua extremidade distal, podendo assim ser chamados de bicaudados ou policaudados.","Certa: músculos podem ter várias cabeças (origem) ou vários tendões de inserção (bicaudado/policaudado)."],
["Os músculos podem desempenhar um tipo de contração denominada isométrica, este tipo de contração ocorre quando as fibras do tendão se alongam.","Errada: isométrica = tensão sem alteração do comprimento nem movimento articular; isotônica = concêntrica (encurta) ou excêntrica (alonga)."],
["A musculatura esquelética é classificada de acordo com a origem e inserção, a origem trata-se da extremidade do músculo presa ao osso que se desloca.","Errada: descreveu a inserção. Origem = ponto fixo/proximal; inserção = ponto móvel/distal."],
["O quadríceps trata-se de um músculo que apresenta quatro cabeças em sua inserção distal.","Errada: tem quatro cabeças na origem (reto femoral, vastos lateral, medial e intermédio) e tendão único na inserção."]],0,{s:"P",tag:"Não é desse semestre"});
Q(1,"Questão 10","A respeito dos músculos que fazem parte do grupo manguito rotador é correto afirmar:",[
["O redondo maior é um músculo do manguito rotador que realiza abdução do ombro.","Errada: o redondo maior não faz parte do manguito (adução/rotação medial)."],
["O deltóide é um músculo do manguito rotador por recobrir a articulação do ombro.","Errada: cobre a articulação mas não é do manguito (abdução)."],
["O subescapular é um músculo do manguito rotador que realiza abdução do ombro.","Errada: o subescapular faz rotação medial."],
["O infraespinhal é um músculo do manguito rotador que realiza rotação lateral do ombro.","Certa. Manguito = SITS: supraespinal (inicia abdução), infraespinal (rotação lateral), redondo menor (rotação lateral), subescapular (rotação medial)."]],3,{s:"P",tag:"Não é desse semestre"});
OX(1,"Questão 11","Cite o caminho da linfa ao passar pelo linfonodo, indicando por onde ela entra, por onde circula internamente e por onde sai (discursiva curta).",
"A linfa entra pelos vasos linfáticos aferentes (vários, perfuram a cápsula na face convexa) → seio subcapsular (marginal) → seios trabeculares, ao longo das trabéculas → seios medulares, entre os cordões medulares → sai pelo vaso linfático eferente, no hilo.\n\nExtra útil: fluxo unidirecional e lento (muitos aferentes, poucos eferentes), o que favorece o contato com macrófagos e linfócitos (córtex: folículos de linfócitos B; paracórtex: T; medula: plasmócitos).",
["Aferentes (cápsula, face convexa)","Seio subcapsular → trabeculares → medulares","Eferente no hilo"],{s:"P"});
OX(1,"Questão 12","Nomeie os músculos da pata de ganso e cite a característica comum de suas inserções tendinosas (discursiva curta).",
"Sartório, grácil e semitendíneo. Característica comum: os três tendões se fundem e se inserem juntos na face ântero-medial da extremidade proximal da tíbia, abaixo do côndilo medial, formando uma expansão tendinosa com aspecto de “pé de ganso” (pes anserinus), separada do ligamento colateral medial pela bursa anserina.\n\nAções em comum: flexão do joelho e rotação medial da perna fletida. Inervação diferente em cada um: sartório (n. femoral), grácil (n. obturatório), semitendíneo (n. isquiático/tibial).",
["Sartório, grácil e semitendíneo","Inserção conjunta na face ântero-medial da tíbia","Bursa anserina"],{s:"P",tag:"Não é desse semestre"});
OX(1,"Questão 13","Descreva, em ordem, todas as estruturas do sistema reprodutor masculino pelas quais os espermatozoides passam desde a sua produção nos testículos até serem expelidos durante a ejaculação (discursiva curta).",
"Em ordem:\n1. Túbulos seminíferos contorcidos (produção, no lóbulo testicular)\n2. Túbulos seminíferos retos\n3. Rede do testículo (rete testis, no mediastino do testículo)\n4. Ductos eferentes (cabeça do epidídimo)\n5. Ducto do epidídimo (cabeça, corpo e cauda: maturação e armazenamento)\n6. Ducto deferente (cordão espermático, canal inguinal, pelve)\n7. Ampola do ducto deferente (dilatação terminal)\n8. Ducto ejaculatório (deferente + ducto da vesícula seminal, dentro da próstata → uretra prostática)\n9. Uretra prostática → uretra membranácea → uretra esponjosa (peniana) → óstio externo da uretra\n\nGlândulas seminais, próstata e bulbouretrais só acrescentam secreção ao sêmen; os espermatozoides não passam por dentro delas (exceto o ducto ejaculatório e a uretra prostática, que atravessam a próstata).",
["Túbulos seminíferos → retos → rede do testículo","Ductos eferentes → epidídimo","Deferente → ampola → ejaculatório","Uretra prostática → membranácea → esponjosa"],{s:"P"});
OX(1,"Questão 14","Descreva as principais diferenças anatômicas entre o jejuno e o íleo (discursiva longa).",
"Extensão: jejuno ≈ 40% do delgado, começa na flexura duodenojejunal (~L2); íleo ≈ 60%, é a porção mais longa e termina na junção ileocecal.\nPosição: jejuno no quadrante superior esquerdo da cavidade; íleo predomina no quadrante inferior direito.\nParede/lúmen: jejuno com parede mais espessa e lúmen mais largo; íleo com parede mais fina e lúmen mais estreito.\nVascularização/cor: jejuno mais vascularizado e mais rosado; íleo menos.\nArtérias retas finais: maiores e mais calibrosas no jejuno; menores no íleo.\nMesentério: jejuno mais fino e pouco gorduroso (vasos visíveis); íleo mais espesso e gorduroso (vasos menos visíveis).\nPregas circulares: muito mais abundantes no jejuno; diminuem e ficam raras perto da junção ileocecal.\nAbsorção: jejuno é a principal região de absorção de nutrientes; íleo continua a absorção, com destaque para vitamina B12 e ácido fólico.\n\nEm comum: ambos inteiramente intraperitoneais, presos à parede posterior pelo mesentério. Não há linha nítida entre eles (transição gradual): a distinção combina vasos + gordura do mesentério + espessura/lúmen + pregas.",
["Extensão e posição","Parede/lúmen e pregas circulares","Vascularização e artérias retas","Mesentério (gordura)","Absorção (B12 no íleo)"],{s:"P"});

Q(2,"Questão 1","Determinado paciente, adulto, hipertenso, obeso, apresenta os seguintes resultados de exames em jejum: Colesterol total = 250 mg/dL; triglicerídeos = 350 mg/dL; HDL Colesterol = 55 mg/dL. Assinale as afirmações abaixo como V (verdadeiro) ou F (falso) e a seguir assinale a alternativa correta.\n( ) A fórmula de Friedewald para o cálculo do colesterol LDL é: LDL-C = (CT – [HDL-C + TG/5])\n( ) TG/5 corresponde ao resultado do VLDL-Colesterol, aplicável para valores normais e muito alterados de triglicerídeos, maiores que 400 mg/dL\n( ) O paciente apresenta Hipercolesterolemia e Hipertrigliceridemia\n( ) O colesterol proveniente da dieta vai participar da formação de ácido biliar ou ser incorporado na síntese de outra lipoproteína ou, ainda, ser estocado como éster de colesterol, apresentando pouca interferência nos níveis dosados em jejum ou após alimentação\n( ) O colesterol proveniente da dieta aumenta os quilomícrons da amostra de sangue\n( ) O perfil lipídico após alimentação diurna, predomina durante a maior parte do dia e tem relação com o risco cardiovascular\nAssinale a alternativa que apresenta a sequência correta de CIMA para BAIXO:",[
["V; F; F; V; V; F","Exigiria item 5 = V e item 6 = F, ambos contrários ao material."],
["V; F; V; V; F; V","Gabarito da prova (leitura pela tabela da prova). Cálculos: LDL-C = 250 − (55 + 70) = 125 mg/dL (< 130); VLDL-C = 350/5 = 70; não-HDL = 195 (ref < 160)."],
["F; F; V; V; F; F","Item 6 é verdadeiro."],
["(Texto da alternativa d indisponível na transcrição da prova.)","O texto desta alternativa não consta na transcrição. Pelo critério estrito da professora (item 3 = F), a sequência coerente com o material seria V; F; F; V; F; V."]],1,
{s:"P",fig:TBL_LIP,obs:"Itens:\n1 V (é a fórmula de Friedewald).\n2 F (TG/5 estima o VLDL-C, mas só vale com TG < 400).\n3 V, discutível (CT 250 > 190 e TG 350 > 150; mas pelo critério “didático” da professora, hipercolesterolemia = LDL-c ≥ 160 — aqui o LDL é 125, então pelo critério estrito seria F).\n4 V (o colesterol da dieta “está de passagem”; o TG é o que mais muda com a alimentação: meta < 150 em jejum, < 175 sem jejum).\n5 F (quilomícrons carregam sobretudo os triglicerídeos da dieta).\n6 V (estado alimentado predomina; por isso o jejum de 12–14 h não é obrigatório). \nConfira a alternativa d na prova original."});
Q(2,"Questão 2","Considerando as recomendações da V Diretriz Brasileira de Dislipidemias, qual é a interpretação mais adequada?",[
["O HDL elevado compensa a hipertrigliceridemia, caracterizando baixo risco cardiovascular.","Errada: HDL alto não “compensa” TG alto."],
["Os triglicerídeos encontram-se na faixa de alto risco (≥ 200 mg/dL), configurando hipertrigliceridemia, o que, associado a hipertensão e obesidade, aumenta significativamente o risco cardiovascular global.","Certa (gabarito da prova). V Diretriz: < 150 desejável (jejum); 150–199 limítrofe; 200–499 alto; ≥ 500 muito alto. Com TG = 350 e fatores de risco agregados, o risco global aumenta."],
["Apenas o colesterol total está alterado; os triglicerídeos não influenciam o risco cardiovascular segundo a diretriz.","Errada: lipoproteínas ricas em TG contribuem para o risco."],
["Os valores lipídicos são considerados limítrofes e não justificam intervenção, mesmo em pacientes com múltiplos fatores de risco.","Errada: não é limítrofe e justifica intervenção."]],1,{s:"P",fig:TBL_LIP});
Q(2,"Questão 3","Correlacionar o teste de tolerância oral à glicose com o metabolismo da glicose e sua via de regulação hormonal nos tempos 0’, 60’; 120’; 180’, para o B, conforme os padrões de resposta ao teste, assinalando abaixo como Verdadeiro (V) ou Falso (F).\n( ) paciente diabético, com tempo 60’ ultrapassando 200 mg/dL\n( ) paciente normal com tempo 60’ que corresponde ao pico de absorção da glicose em torno de 140 mg/dL\n( ) tempo 60’ acontecem glicólise e glicogênese\n( ) tempo 120’, os níveis de glicemia e insulina começam a subir e estabilizar\n( ) tempo 180’, volta aos níveis basais, sendo maior ou igual a 126 mg/dL\n( ) após o tempo 180’ a manutenção da glicemia é regulada pela liberação de glicose pelo fígado",[
["V; F; F; V; V; F","Errada."],
["F; V; V; F; F; V","Certa. 1 F (a curva que ultrapassa 200 é a A; a pergunta é sobre a B). 2 V (pico ~140 aos 60’). 3 V (insulina alta, estado alimentado: glicólise e glicogênese). 4 F (aos 120’ glicemia e insulina estão caindo). 5 F (aos 180’ volta ao basal; ≥ 126 é limiar de diabetes em jejum). 6 V (glicogenólise e gliconeogênese hepáticas, glucagon)."],
["F; V; V; V; F; F","Errada: item 4 é falso."],
["V; V; F; F; V; F","Errada."]],1,{s:"P",fig:SVG_TOTG,obs:"Padrão normal (curva B): glicemia sobe e atinge pico ~140 mg/dL aos 60’; insulina sobe junto; aos 120’ ambas caem; ~180’ retorna ao basal. Curva A (diabético): ultrapassa 200 e volta lentamente (diagnóstico: ≥ 200 mg/dL às 2 h; jejum ≥ 126)."});
Q(2,"Questão 4","Pacientes normoglicêmicos apresentam processos metabólicos que variam durante o dia e conforme a dieta alimentar. Faça a associação correta:\nA) Quebra da molécula de glicose para produzir energia / Insulina aumenta e Glucagon diminui\nB) Quebra do glicogênio / Glucagon (no fígado) e adrenalina (nos músculos).\nC) Síntese de glicogênio a partir de moléculas de glicose / Insulina\nD) Formação de moléculas de glicose a partir de precursores não-glicídicos / Glucagon estimula e Insulina limita\n( ) Glicogênese\n( ) Glicogenólise\n( ) Gliconeogênese\n( ) Glicólise\nAssinale a alternativa correta:",[
["C; B; D; A","Certa: glicogênese = C; glicogenólise = B; gliconeogênese = D; glicólise = A."],
["B; D; A; C","Errada."],
["A; C; B; D","Errada."],
["D; A; C; B","Errada."]],0,{s:"P",fig:'<div class="tw"><table class="tbl"><caption>Resumo do gabarito</caption><thead><tr><th>Via</th><th>O que faz / hormônios</th></tr></thead><tbody><tr><td>Glicólise (A)</td><td>Glicose → piruvato (citosol), gera ATP; estado alimentado: insulina ↑, glucagon ↓</td></tr><tr><td>Glicogenólise (B)</td><td>Quebra do glicogênio; glucagon (fígado) e adrenalina (músculo/fígado)</td></tr><tr><td>Glicogênese (C)</td><td>Síntese de glicogênio a partir de glicose; estimulada pela insulina</td></tr><tr><td>Gliconeogênese (D)</td><td>Glicose a partir de lactato, glicerol e aminoácidos (fígado/rim); glucagon (e cortisol) estimulam, insulina inibe</td></tr></tbody></table></div>',figAfter:true});
Q(2,"Questão 5","Um paciente apresenta manchas hipo e hipercrômicas no tronco, levemente descamativas. Suspeitando de Pitiríase versicolor o médico solicita exame micológico direto, utilizando escamas obtidas por raspagem suave das lesões. Com base nos métodos diagnósticos e achados laboratoriais característicos dessa dermatose, qual alternativa descreve corretamente o agente etiológico e o resultado esperado do exame direto com KOH 20% acrescido de tinta Parker?",[
["Trichophyton rubrum; observação de hifas septadas longas e numerosos artroconídeos.","Errada: T. rubrum é dermatófito (hifas hialinas septadas + artroconídios)."],
["Candida albicans; presença de pseudo-hifas… isolados…","Errada: Candida é levedura com pseudo-hifa, não o achado típico da pitiríase versicolor. (o trecho do meio está ilegível na foto da prova)"],
["…associados a aglomerados de blastoconídeos (“espaguete com almôndegas”), evidenciados com maior contraste pela tinta Parker.","Certa (gabarito da prova): Malassezia, com filamentos curtos e tortuosos e blastoconídios agrupados. (o início desta alternativa está cortado na foto da prova)"],
["Microsporum canis; identificação de macroconídeos fusiformes com parede espessa.","Errada: M. canis = tinha (dermatófito); macroconídeos fusiformes aparecem na cultura."]],2,
{s:"P",obs:"Agente: Malassezia spp. (M. furfur, M. globosa), levedura lipofílica comensal; favorecida por calor, umidade e oleosidade. Lesões hipo/hipercrômicas, descamação furfurácea (sinal de Zileri); luz de Wood: fluorescência amarelo-dourada. KOH 10–20% dissolve a queratina; tinta Parker cora as estruturas fúngicas. A imagem “espaguete com almôndegas” e a tinta Parker são complemento (não constam no material das professoras)."});
Q(2,"Questão 6","Paciente, com atraso menstrual de 7 dias, compareceu na unidade de saúde para avaliação médica. Antes, porém, muito curiosa, foi a um laboratório, onde colheu sangue para o teste de gravidez, cujo resultado foi 40 mIU/ml, o que indicava gestação conforme os valores de referência. Saiu dali muito feliz, entretanto sua alegria não durou muito, pois o teste realizado na urina, na triagem da unidade, deu resultado negativo. Assinale as afirmativas abaixo com verdadeiro (V) ou falso (F), marcando abaixo a alternativa correta:\n( ) Com base nos exames da paciente, é possível excluir a possibilidade de gestação, visto que o teste na urina deu negativo\n( ) Dosagens de βhCG com níveis elevados, podem ser detectados em homens e mulheres, na presença de tumores de células germinativas\n( ) βhCG no sangue acima de 25 mIU/ml, indica resultado positivo para gravidez em curso, devendo associar com dados clínicos e US\n( ) O teste de gravidez na urina é muito mais sensível que o realizado no sangue\n( ) A dosagem de βhCG está aumentada na presença tumores produtores de gonadotrofina coriônica como na Mola Hidatiforme",[
["F; V; F; V; V","Errada."],
["F; V; V; F; V","Certa. 1 F (urina negativa não exclui gestação). 2 V (marcador de tumores de células germinativas). 3 V (> 25 positivo; correlacionar com clínica e US). 4 F (o sangue é mais sensível). 5 V (mola hidatiforme, coriocarcinoma)."],
["V; F; V; V; F","Errada."],
["V; V; F; F; V","Errada."]],1,{s:"P",obs:"O hCG é produzido pelo sinciciotrofoblasto. No soro: dosagem quantitativa com limiar baixo (< 5 negativo; 5–25 indeterminado → repetir; > 25 positivo). Na urina: teste qualitativo, limiar maior e urina diluída → falso-negativo no início da gestação. Com 7 dias de atraso, 40 mUI/mL no sangue pode ainda estar abaixo do limiar da urina."});
Q(2,"Questão 7","A análise do sêmen é fundamental na investigação inicial de infertilidade masculina. Segundo o Manual da OMS, diversos fatores pré-analíticos influenciam diretamente a interpretação clínica dos resultados. Em um paciente com suspeita de infertilidade, qual das situações abaixo deve ser considerada para correta avaliação clínica, devido à importância da coleta e das limitações do exame.",[
["Concluir infertilidade masculina definitiva após um único espermograma alterado, desde que a amostra tenha sido analisada dentro de 2 horas após a ejaculação.","Errada: um único exame não define infertilidade."],
["Orientar o paciente a realizar nova coleta caso a primeira amostra não tenha sido obtida por masturbação direta em recipiente estéril, pois erros de coleta podem comprometer a interpretação clínica.","Certa: coleta por masturbação em frasco próprio (coito interrompido não vale); abstinência de 2 a 7 dias; coleta inadequada → nova coleta; febre alta pode alterar; repetição com intervalo de semanas."],
["Desconsiderar a necessidade de período de abstinência, desde que a amostra esteja liquefeita, pois isso não influencia parâmetros como concentração e motilidade.","Errada: a abstinência altera volume, concentração e motilidade."],
["Solicitar o espermograma apenas após avaliação hormonal, uma vez que o exame seminal não tem valor clínico isolado na investigação.","Errada: o espermograma é o exame de 1ª linha."]],1,{s:"P"});
Q(2,"Questão 8","Paciente primigesta, Rh negativo, esposo Rh positivo, durante exames de pré-natal foi orientada a realizar o Teste de Coombs e profilaxia com imunoglobulina anti-D. Assinale abaixo a alternativa correta relacionada ao tipo de Teste de Coombs a ser realizado na gestante Rh negativo e qual sua finalidade:",[
["Teste de Coombs direto; sua finalidade é detectar anticorpos anti-D já ligados às hemácias da gestante, indicando necessidade de dose adicional de imunoglobulina anti-D no pré-natal.","Errada: o direto é do bebê (hemácias já sensibilizadas in vivo)."],
["Teste de Coombs indireto; sua finalidade é identificar anticorpos anti-D livres no soro materno, avaliando se houve sensibilização prévia e a necessidade de profilaxia com imunoglobulina anti-D.","Certa: soro da mãe + hemácias O positivo lavadas + soro de Coombs → aglutinação = positivo. Negativo = não sensibilizada → indica profilaxia; positivo = já sensibilizada (profilaxia não resolve; acompanhar o feto). Título crítico = 1:16."],
["Teste de Coombs direto; sua finalidade é rastrear anticorpos anti-D circulantes no soro materno antes da sensibilização, sendo utilizado para indicar a profilaxia anti-D de rotina.","Errada: o rastreio de anticorpos circulantes é o indireto."],
["Teste de Coombs indireto; sua finalidade é detectar anticorpos IgM naturais contra antígenos eritrocitários fetais, prevenindo isoimunização na gestação atual.","Errada: os anticorpos relevantes são IgG anti-D imunes, não IgM “naturais”."]],1,{s:"P"});
Q(2,"Questão 9","A prevenção da isoimunização Rh é fundamental no cuidado pré-natal de gestantes Rh negativo. A imunoglobulina anti-D (RhoGAM) é utilizada rotineiramente para evitar a sensibilização materna ao antígeno D. Sobre seu uso clínico e mecanismo de ação, assinale a alternativa correta.",[
["A RhoGAM estimula o sistema imune materno a produzir anticorpos IgG anti-D, garantindo proteção ativa duradoura para gestante e feto.","Errada: é imunização passiva, não ativa."],
["A RhoGAM neutraliza anticorpos anti-D já existentes na circulação materna, sendo indicada somente após a paciente apresentar Coombs indireto positivo.","Errada: não neutraliza anticorpos já formados; se já sensibilizada, não adianta."],
["A RhoGAM contém anticorpos IgG anti-D que removem rapidamente da circulação materna hemácias fetais Rh positivo, prevenindo que o sistema imune da gestante produza seus próprios anticorpos anti-D; é indicada para toda gestante Rh negativo não sensibilizada.","Certa: 300 µg IM entre a 28ª e a 34ª semana; pós-parto de RN Rh+ em até 72 h (máx. 28 dias, com menor garantia); e em eventos sensibilizantes (aborto, ectópica/mola, sangramento, amniocentese, trauma)."],
["A RhoGAM age bloqueando receptores fetais para o antígeno D, impedindo a passagem de hemácias fetais Rh positivo para a circulação materna; por isso é aplicada apenas no pós-parto.","Errada: não bloqueia receptores fetais e não é só no pós-parto."]],2,{s:"P"});
Q(2,"Questão 10","Associe cada agente etiológico com o método laboratorial para detecção durante a gestação / manifestações / características no feto/recém-nascido da coluna abaixo.\nI. Toxoplasma gondii   II. Vírus da Rubéola   III. Citomegalovírus (CMV)   IV. ZIKA Vírus   V. Herpes vírus simples\n( ) Sorologia IgG e IgM / erupção vesicular, doença disseminada com envolvimento de órgãos viscerais, hepatite, pneumonite\n( ) Detecção do DNA viral por PCR na urina / Hepatoesplenomegalia, hidrocefalia, coriorretinite, microcefalia, calcificações cerebrais\n( ) Sorologia IgG e IgM / Coriorretinite, lesões oculares + calcificações cerebrais difusas, microcefalia.\n( ) Detecção do RNA viral / microcefalia, catarata, calcificações intraoculares\n( ) Sorologia IgG e IgM / Surdez neurossensorial + catarata + cardiopatia\nAssinale a alternativa correta na qual as associações estão corretas:",[
["III; I; IV; II; V","Errada."],
["IV; III; II; I; V","Errada."],
["V; III; I; IV; II","Certa. Herpes: clínico + PCR da vesícula, erupção vesicular/doença disseminada. CMV: PCR no DNA viral em urina/saliva nas 3 primeiras semanas, hepatoesplenomegalia, coriorretinite, microcefalia. Toxoplasma: sorologia IgG/IgM (+ avidez), tétrade de Sabin. Zika: RNA viral (RT-PCR) até 5 dias do início dos sintomas; microcefalia com calcificações. Rubéola: sorologia IgG; surdez, catarata, cardiopatia (PCA, estenose pulmonar), “sal e pimenta”."],
["II; IV; III; V; I","Errada."]],2,{s:"P",
fig:'<div class="tw"><table class="tbl"><caption>Resumo do gabarito</caption><thead><tr><th>Agente</th><th>Diagnóstico</th><th>Feto/RN</th></tr></thead><tbody><tr><td>V Herpes simples</td><td>Clínico + PCR do conteúdo das vesículas</td><td>Erupção vesicular; doença disseminada (hepatite, pneumonite, CIVD)</td></tr><tr><td>III CMV</td><td>PCR do DNA viral na urina ou saliva nas 3 primeiras semanas</td><td>Hepatoesplenomegalia, coriorretinite, microcefalia, hidrocefalia, perda auditiva</td></tr><tr><td>I Toxoplasma</td><td>Sorologia IgG/IgM (+ avidez)</td><td>Tétrade de Sabin</td></tr><tr><td>IV Zika</td><td>RT-PCR até 5 dias do início dos sintomas</td><td>Microcefalia com calcificações, retina e membros</td></tr><tr><td>II Rubéola</td><td>Sorologia IgG; avidez; PCR vilo/líquido amniótico</td><td>Surdez, catarata/glaucoma, cardiopatia, “sal e pimenta”</td></tr></tbody></table></div>',figAfter:true});
OX(2,"Questão 11 (DC)","Analise o exame apresentado abaixo, de paciente adulto, e identifique qual o provável agente etiológico envolvido na infecção do paciente, quais as alterações leucocitárias e plaquetárias, qualitativas e quantitativas observadas, respeitando a nomenclatura utilizada em hematologia.",
"Padrão viral (a clínica do enunciado orienta para dengue). Alterações:\n• Leucopenia (2.800/µL; ref 4.000–11.000).\n• Neutropenia (segmentados 20% = 560/µL; ref 2.000–7.500; bastonetes 56/µL, sem desvio à esquerda).\n• Linfocitose relativa (70%; ref 25–40%) com contagem absoluta normal (1.960/µL; ref 1.500–4.000).\n• Linfócitos atípicos presentes (7% = 196/µL): linfócitos reativos da resposta viral.\n• Monocitopenia (1%; 28/µL; ref 3–7%; 200–800); eosinófilos e basófilos zerados.\n• Plaquetopenia/trombocitopenia (70.000/mm³; ref 150.000–450.000).\nSegundo a professora: leucopenia + predomínio de linfócitos + atípicos (linfócitos reativos, sinal de resposta imune ativa) + sem desvio à esquerda = padrão viral; a plaquetopenia reforça o contexto de dengue.",
["Agente: vírus (padrão viral)","Leucopenia e neutropenia","Linfocitose relativa + linfócitos atípicos","Sem desvio à esquerda","Plaquetopenia"],{s:"P",fig:TBL_LEUCO});
OX(2,"Questão 12 (DL)","O paciente da questão anterior apresentou um agravamento do quadro e precisou passar por longo período de internação, no qual desenvolveu uma pneumonia complicada. Sua contagem de leucócitos alcançou 20.000/mm³, com predomínio de neutrófilos e desvio à esquerda. Outros resultados de exames: PCR = 120 mg/dL; VHS = 100 mm.\na) Com base nos resultados, qual a etiologia da pneumonia?\nb) Interprete os resultados de PCR e VHS, justificando os mesmos.\nc) Qual a função da PCR?\nd) O que é Desvio a Esquerda citado no enunciado da questão?\nDados: valores de referência: PCR — inferior a 5 mg/dL; VHS: 1ª hora, homens 0 a 15 mm",
"a) Etiologia bacteriana: leucocitose (20.000) com neutrofilia e desvio à esquerda, PCR e VHS muito altos. Pelo contexto (internação prolongada), pneumonia nosocomial (ex.: gram-negativos, S. aureus).\nb) PCR = 120 (ref < 5): ~24× o limite → inflamação/infecção bacteriana aguda intensa (sobe em horas e cai rápido com tratamento eficaz). VHS = 100 mm (ref 0–15): muito aumentado → inflamação sistêmica (o fígado produz mais fibrinogênio, que neutraliza as cargas negativas das hemácias → empilhamento em rouleaux → sedimentam mais rápido); inespecífico e de subida/queda lentas. Os dois concordam com um processo inflamatório bacteriano grave.\nc) Função da PCR: proteína de fase aguda sintetizada pelo fígado (estímulo da IL-6); ativa o complemento e facilita a opsonização/fagocitose. Clinicamente: marcador de inflamação/infecção bacteriana e de resposta ao tratamento.\nd) Desvio à esquerda: aparecimento no sangue periférico de neutrófilos jovens (aumento de bastonetes, podendo haver metamielócitos e mielócitos) por liberação acelerada da medula, típico de infecção bacteriana grave.",
["Etiologia bacteriana (nosocomial)","PCR ~24× e VHS 100: inflamação bacteriana grave","PCR: fase aguda, IL-6, complemento, fagocitose","Desvio à esquerda = neutrófilos jovens/bastonetes"],{s:"P"});
OX(2,"Questão 13 (DC)","Interprete os resultados das proteínas totais e frações dosadas no sangue, cujos resultados estão abaixo, para cada um dos pacientes (a, b, c). Justifique cada caso:\na) Paciente renal crônico:\nb) Paciente com cirrose hepática:\nc) Paciente desnutrido (Kwashiorkor):",
"Leitura do resultado: proteínas totais 5,0 (↓); albumina 2,8 (↓); globulinas 2,2 (normal); A/G = 2,8/2,2 = 1,27 (normal; ≥ 1,1). Ou seja: hipoproteinemia por hipoalbuminemia, com globulinas e relação A/G preservadas. A albumina responde pela maior parte da pressão oncótica → risco de edema.\na) Renal crônico: perda urinária de albumina (proteinúria/síndrome nefrótica) → hipoalbuminemia e hipoproteinemia; globulinas normais.\nb) Cirrose: ↓ síntese hepática de albumina → hipoalbuminemia (ascite/edema). Na cirrose mais avançada as globulinas tendem a subir (hipergamaglobulinemia) e a A/G se inverte (< 1); aqui isso não aparece.\nc) Kwashiorkor: a desnutrição reduz a matéria-prima (aminoácidos) → o fígado produz menos albumina → hipoalbuminemia e edema; globulinas preservadas.",
["PT e albumina baixas; globulinas e A/G normais","Renal: perda urinária de albumina","Cirrose: menor síntese hepática","Desnutrição: falta de aminoácidos"],{s:"P",fig:TBL_PROT});
OX(2,"Questão 14 (DC)","Interprete os resultados abaixo de pacientes gestantes que realizaram exames para sífilis:\na) Gestante com VDRL reagente 1/32 e teste treponêmico Não Reagente na primeira consulta do pré-natal. Foi realizado outro teste treponêmico, que também deu resultado Não Reagente:\nb) Gestante com teste treponêmico Reagente e VDRL 1/128 na admissão para o parto, sem tratamento documentado:\nc) RN com VDRL maior que o da mãe (diferença ≥ 2 diluições), imediatamente após o nascimento:\nd) RN com VDRL menor ou igual ao da mãe, assintomático, mãe adequadamente tratada:",
"a) Sífilis não confirmada: o treponêmico é muito sensível e, não reagente (em dois métodos), descarta; o VDRL alto sem treponêmico é anticorpo anticardiolipina por outra causa (lúpus, SAF, autoimune) → falso-positivo; sem tratamento.\nb) Sífilis em gestante não tratada/ativa (título alto); tratar com penicilina benzatina (2,4 milhões UI IM: dose única se primária/secundária/latente recente; 1×/semana por 3 semanas se latente tardia ou de duração ignorada) e notificar (compulsória). Sem tratamento documentado = inadequado → RN deve ser avaliado e tratado como sífilis congênita.\nc) RN com VDRL ≥ 2 diluições maior que o da mãe (ex.: mãe 1:8 → RN ≥ 1:32) → produção ativa de anticorpos pelo RN (sangue periférico colhido junto com o da mãe) → sífilis congênita (notificar, investigar e tratar).\nd) RN assintomático, VDRL ≤ materno e mãe adequadamente tratada → criança exposta, não caso de sífilis congênita; o título pode ser IgG materno transferido. Seguimento clínico e do VDRL (1, 3, 6, 12 e 18 meses); se persistir reagente após ~6 meses, reavaliar como sífilis congênita.\n\nO professor avisou que o tratamento não será cobrado; o que cai é interpretar sorologia. Treponêmico reagente após 18 meses = congênita. Série de diluições: 1:1 → 1:2 → 1:4 → 1:8 → 1:16 → 1:32 → 1:64 → 1:128; duas diluições = 4× o título.",
["a) Falso-positivo do VDRL; treponêmico descarta","b) Gestante não tratada/ativa → tratar e notificar","c) ≥ 2 diluições acima da mãe = congênita","d) Criança exposta; seguimento do VDRL"],{s:"P"});

["O ducto colédoco e o ducto pancreático se unem formando um ducto comum na ampola hepatopancreática, também conhecida como papila de Santorini.","Errada: a ampola hepatopancreática é a de Vater (papila maior); Santorini é a papila menor."],

["A principal função do intestino grosso é a digestão e absorção de nutrientes, sendo responsável pela maior parte da digestão dos carboidratos complexos.","Errada: a função do grosso é absorver água e eletrólitos e formar as fezes; a digestão/absorção de nutrientes é do delgado."],

Q(3,"Questão A6","Sobre o sistema reprodutor masculino e feminino e o controle hormonal, classifique V ou F e marque a sequência de cima para baixo:\n( ) Os tubos seminíferos, nos testículos, produzem os espermatozoides.\n( ) A testosterona estimula a formação de espermatozoides e é responsável pelos caracteres sexuais secundários (pelos, voz).\n( ) Os ovários (gônadas femininas) produzem os gametas femininos e também estrogênio e progesterona.\n( ) Na ejaculação, os espermatozoides passam pelas glândulas seminais, pela próstata, pelo canal deferente e pela uretra.\n( ) A próstata é dividida em dois lobos, determinados pela uretra prostática.",[

OX(3,"Questão A7 (discursiva curta, 1,0)","Explique a delimitação anatômica dos 9 quadrantes abdominais.",
"Dois planos horizontais (superior: subcostal ou transpilórico; inferior: intertubercular ou interespinal) e dois verticais (linhas hemiclaviculares/mediopupilares D e E) cruzam-se como um “#” e dividem o abdome em 3 × 3: hipocôndrio D, epigástrio, hipocôndrio E (superior); flanco D, umbilical, flanco E (meio); fossa ilíaca D, hipogástrio (púbica), fossa ilíaca E (inferior). Os planos horizontais variam conforme o livro.",
["2 planos horizontais (subcostal/transpilórico e intertubercular/interespinal)","2 planos verticais (hemiclaviculares)","Nove regiões: hipocôndrios, epigástrio, flancos, umbilical, fossas ilíacas, hipogástrio"],{s:"A"});
OX(3,"Questão A8 (discursiva longa, 2,0)","Analise a imagem (vista superior da pelve feminina) e escreva o nome das estruturas 1 a 6 e a função de cada uma.",
"1. Ligamento sacro-uterino: posterior; projeta-se para trás e fixa o útero (colo).\n2. Ligamento reto-uterino: posterior; circunda o reto, com fibras no colo.\n3. Ligamento transverso do colo (cardinal / de Mackenrodt): lateral; contorna o colo e forma uma “asa” até a face lateral do ilíaco; fixa o colo.\n4. Ligamento redondo do útero: sustenta a parte lateral e superior do útero e entra no canal inguinal.\n5. Ligamento vesico-uterino: anterior; fixa o útero no sentido da bexiga.\n6. Ligamento útero-ovariano (perto da tuba): liga o útero ao ovário.\n\nAtenção: identificação inferida pelo slide 41 do material; o item 6 é o mais incerto — confira no slide. Mais ligamentos se concentram no colo (parte inferior); quase não há no corpo/fundo. Mesométrio (ligamento largo) ≠ miométrio.",
["1 sacro-uterino","2 reto-uterino","3 transverso do colo (cardinal)","4 redondo do útero","5 vesico-uterino","6 útero-ovariano"],{s:"A",fig:FIG("pelvis","Vista superior da pelve feminina com estruturas numeradas de 1 a 6","Vista superior da pelve feminina (figura da prova)")});
OX(3,"Questão A9 (discursiva longa, 2,0)","Analise a imagem e escreva o nome e a função das estruturas indicadas pelos números 1 a 6.",
"1. Glomérulo (corpúsculo renal): novelo de capilares entre as arteríolas aferente e eferente; início da filtração.\n6. Cápsula de Bowman: envolve o glomérulo; junto com ele forma o corpúsculo renal; recebe o filtrado.\n2. Túbulo contorcido proximal: reabsorção e secreção.\n3. Alça de Henle (em “U”): segmento em “U” que liga o proximal ao distal; concentração da urina.\n4. Túbulo contorcido distal: ajuste final de reabsorção/secreção; segue para o coletor.\n5. Ducto coletor: recebe vários néfrons e leva a urina ao ducto papilar → papila → cálices → pelve.",
["1 glomérulo","2 túbulo contorcido proximal","3 alça de Henle","4 túbulo contorcido distal","5 ducto coletor","6 cápsula de Bowman"],{s:"A",fig:FIG("nephron","Néfron com estruturas numeradas de 1 a 6","Néfron (figura da prova)")});
OX(3,"Questão A10 (discursiva curta, 1,0)","Descreva as diferenças anatômicas da uretra e da bexiga: (a) uretra feminina × masculina; (b) bexiga urinária masculina × feminina.",
"a) Uretra. Masculina: longa, em 4 partes — intramural (pré-prostática), prostática, membranácea e esponjosa — até o óstio uretral externo no pênis. Feminina: curta (~4 cm), só urinária; sai da bexiga e abre-se no vestíbulo da vagina (óstio externo da uretra, anterior ao óstio da vagina).\nb) Bexiga. Mesmas partes nos dois sexos (ápice, corpo, fundo, colo e trígono) e os ureteres entram pela parede posterior em ambos. No homem, a próstata fica logo abaixo e as vesículas seminais atrás; na mulher a bexiga se relaciona com o útero e a vagina (complemento).",
["Uretra masculina longa, 4 partes","Uretra feminina curta (~4 cm), só urinária","Bexiga: mesmas partes; relações diferentes (próstata × útero/vagina)"],{s:"A"});
