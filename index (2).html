Q(4,"Questão C1","Bactérias Gram-positivas colonizam pele e mucosas e são frequentemente isoladas em culturas. Marque V ou F:\n( ) Staphylococcus aureus pode causar infecções piogênicas como impetigo, foliculites e furúnculos.\n( ) Impetigo acomete principalmente adultos.\n( ) Terçol é a foliculite localizada na base da pálpebra.\n( ) Carbúnculo é formado pela união de furúnculos.\n( ) S. aureus pode causar infecções disseminadas como bacteremia.",[
["V; F; F; V; V","Errada."],
["F; V; V; F; V","Errada."],
["V; F; V; V; V","Certa. V S. aureus causa supurativas (impetigo, foliculite, furúnculo, carbúnculo); F impetigo é superficial, em crianças; V terçol = foliculite na base da pálpebra; V carbúnculo = vários furúnculos juntos; V disseminadas: bacteremia, endocardite, pneumonia, osteomielite, artrite séptica."],
["F; V; V; F; F","Errada."]],2,{s:"A"});
Q(4,"Questão C2","Streptococcus spp. são cocos Gram-positivos aos pares ou em cadeia, classificados pela capacidade de lisar eritrócitos em meio com sangue. Relacione: I S. pneumoniae; II S. pyogenes; III S. agalactiae; IV S. viridans.\n( ) Pneumonia, meningite, sinusite e infecção do ouvido médio\n( ) Infecções supurativas de vias aéreas superiores\n( ) Septicemia em pacientes neutropênicos\n( ) Cárie dentária\n( ) Evitar locais aglomerados e fechados e vacinação\n( ) Doença neonatal (bacteremia, meningite…)",[
["I, II, IV, III, I, IV","Errada."],
["II; IV; I, III; IV; I","Errada."],
["I, II; IV; IV; I; III","Certa: I S. pneumoniae (pneumonia, otite, sinusite, meningite; prevenção = vacina e evitar aglomerados); II S. pyogenes (supurativas de pele/tecidos moles e vias aéreas superiores); III S. agalactiae (doença neonatal; triagem e penicilina intraparto); IV grupo viridans (septicemia em neutropênicos, endocardite e cárie). Sequência das linhas: I, II, IV, IV, I, III."],
["IV; I; II; II; III; I","Errada."]],2,{s:"A"});
OX(4,"Questão C3 (discursiva curta, 1,0)","Dona Brígida coletou urina para exames de rotina e urocultura e o laboratório pediu nova coleta, alegando contaminação. Oriente a paciente para uma coleta adequada de urina.",
"Orientação à paciente: (1) higienizar a região genital com água e sabão; (2) afastar os lábios (menos secreção vaginal); (3) desprezar o 1º jato e coletar o jato médio; (4) posicionar o frasco sem encostar nas secreções; (5) evitar coletar durante menstruação/corrimento importante, quando possível; (6) entregar logo ao laboratório: a demora deixa as bactérias se multiplicarem (bacteriúria falsa).",
["Higiene com água e sabão","Afastar os lábios","Desprezar o 1º jato; coletar o jato médio","Evitar menstruação/corrimento","Entregar rápido ao laboratório"],{s:"A"});
OX(4,"Questão C4 (discursiva)","Interprete o resultado de urina I (homem, 30 anos). a) A amostra foi bem coletada? Justifique. b) O resultado é compatível com: c) Justifique a resposta b. d) O que significa a presença de nitrito?",
"a) Sim: as células epiteliais são raras (sem sinal de contaminação por uretra/vagina) e há leucócitos e bactérias coerentes entre si.\nb) Compatível com infecção do trato urinário bacteriana.\nc) Piúria importante (300/campo; ref. até 4), bacteriúria numerosa, nitrito positivo e proteinúria em traços (inflamação); pH e sangue normais. Sem excesso de epiteliais, a combinação piúria + nitrito + bacteriúria é forte para ITU; confirmar com urocultura/antibiograma (jato médio: > 10⁵ UFC).\nd) Nitrito positivo indica bactérias que transformam nitrato em nitrito, sobretudo enterobactérias/Gram-negativas. Nitrito negativo, sozinho, não exclui infecção.",
["Boa coleta: epiteliais raras","ITU bacteriana","Piúria + bacteriúria + nitrito","Nitrito: bactérias redutoras de nitrato (Gram-negativas)"],{s:"A",fig:TBL_URI});
Q(4,"Questão C5","Mary, com 5 dias de atraso menstrual, fez teste de sangue (β-hCG 50 mUI/mL, positivo pelos valores de referência), mas o teste de urina na unidade deu negativo. Marque V ou F:\n( ) É possível excluir gestação, pois o teste de urina deu negativo.\n( ) hCG acima de 25 mUI/mL indica gravidez em curso, devendo associar a dados clínicos e US.\n( ) A concentração de β-hCG na urina pode ser muito menor que a do sangue.\n( ) β-hCG elevado pode ser detectado em homens e mulheres com tumores de células germinativas.",[
["F, V, V, V","Certa. F urina negativa não exclui gestação (o hCG aparece antes no sangue; a urina só positiva ao atingir a sensibilidade, ~25 UI); V > 25 UI compatível com gestação, somado à clínica e à US; V a urina depende de filtração/excreção e pode ter concentração bem menor; V tumores de células germinativas elevam o β-hCG em homens e mulheres. Conduta da aula: atraso menstrual com teste negativo → repetir em ~1 semana."],
["F; V, F, V","Errada: a 3ª é verdadeira."],
["V, F, F, V","Errada."],
["V, F, V, F","Errada."]],0,{s:"A"});
Q(4,"Questão C6","Gestante admitida na maternidade com teste treponêmico reagente e VDRL 1/128; logo após o nascimento coletou-se sangue do RN para pesquisa de sífilis congênita (SC). São corretas:\nI. Teste não treponêmico não reagente ou reagente com titulação menor que a materna indica baixo risco de SC.\nII. A primeira coleta não caracteriza SC, mas passagem de anticorpos IgM maternos.\nIII. Título de VDRL 1/512, 48 h após o nascimento, caracteriza SC.\nIV. Teste treponêmico reagente após 18 meses do nascimento caracteriza SC.\nV. RN de mães com sífilis detectada na maternidade devem ser testados com teste treponêmico e titulação pelo VDRL.",[
["I, II, III, V","Errada: inclui o item II."],
["II, IV, V","Errada: inclui o item II e omite I e III."],
["I, III, IV, V","Certa. I (V) RN não reagente ou com título ≤ ao materno → anticorpos maternos, baixo risco. II (F) o que atravessa a placenta é a IgG (a IgM, de alto peso molecular, não). III (V) 128 → 256 → 512 = 2 diluições acima da mãe. IV (V) treponêmico reagente após 18 meses = anticorpos do bebê = SC. V (V) ao nascimento ambos os testes podem estar reagentes só por anticorpos maternos; por isso se comparam títulos e se acompanha."],
["I, III, V","Errada: omite o item IV."]],2,{s:"A"});
Q(4,"Questão C7","Sobre o espermograma (investigação inicial da infertilidade masculina), assinale a alternativa com todas as afirmações corretas:\nI. A amostra pode ser coletada por coito interrompido.\nII. Abstinência ideal de 2 a 7 dias.\nIII. O sêmen é composto pelas secreções das glândulas prostática, seminal e bulbouretral + espermatozoides do epidídimo.\nIV. Para confirmar, duas amostras com intervalo de dois dias.\nV. A frutose, do líquido prostático, forma o ATP que fornece energia aos espermatozoides.\nVI. Febre alta pode alterar o resultado.",[
["II, III, V","Errada: V é falsa."],
["I, III, IV","Errada: I e IV são falsas."],
["III, IV, VI","Errada: IV é falsa."],
["II, III, VI","Certa. I (F) coito interrompido não vale (masturbação, frasco próprio). II (V) abstinência de 2 a 7 dias. III (V) vesícula seminal + próstata + bulbouretral + espermatozoides do epidídimo. IV (F) repetição com intervalo maior (semanas). V (F) a frutose vem do líquido da vesícula seminal. VI (V) febre alta pode alterar."]],3,{s:"A"});
Q(4,"Questão C8","Mariel tem corrimento vaginal branco, grumoso (“leite coalhado”), prurido intenso e ardor ao urinar. O material mostrou as estruturas da figura, compatíveis com ______ e quadro clínico ______:",[

Q(4,"Questão C9","Associe as sorologias de toxoplasmose em gestantes: I IgG+ e IgM−; II IgG− e IgM−; III IgG− e IgM+; IV IgG+ e IgM+.\n( ) Compatível com infecção aguda\n( ) Compatível com infecção pregressa\n( ) Compatível com infecção aguda, em fase de soroconversão\n( ) Paciente não infectada",[

["III, I, IV, II","Certa. III (IgG−/IgM+) = infecção aguda (muito recente); I (IgG+/IgM−) = pregressa; IV (IgG+/IgM+) = provável aguda em fase de soroconversão (avidez de IgG ajuda a datar); II (IgG−/IgM−) = não infectada, suscetível."],
["II, IV, I, III","Errada: coloca II (não infectada) como “aguda”."],
["IV, III, II, I","Errada: coloca IV como 1ª e I como “não infectada”."]],1,{s:"A"});
Q(4,"Questão C10","Na curva glicêmica de dois participantes, um diabético (I) e um normal (II), assinale a correta:",[

Q(4,"Questão C11","João, 35 anos, com muita sede e polaciúria, mãe diabética, glicose de jejum sempre normal. TOTG: jejum 90 mg/dL; 120 min: 130; 240 min: 78; 300 min: 92. Interprete:",[

function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,R){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(R()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function sample(arr,n,R){return shuffle(arr,R).slice(0,n);}
function rint(n){return Math.floor(Math.random()*n);}
function pickRand(a){return a[rint(a.length)];}
function newSeed(){return Math.floor(Math.random()*2147483647);}

function C(n,k){if(k<0||k>n)return 0;var r=1;for(var i=1;i<=k;i++)r=r*(n-k+i)/i;return r;}
function fmt(n){if(n>=1e9)return (n/1e9).toFixed(1).replace(".",",")+" bi";if(n>=1e6)return (n/1e6).toFixed(1).replace(".",",")+" mi";if(n>=1e3)return Math.round(n/100)/10+" mil";return String(Math.round(n));}

function rowsCount(bl){var n=0;bl.S.forEach(function(p){n+=p.rows.length;});return n;}
function genCount(bl){var g=0;bl.S.forEach(function(p){var n=p.rows.length;if(n>=4)g+=C(n,4)*(4+4+14);if(n>=5)g+=C(n,5)*30;});
  bl.P.forEach(function(p){var n=p.pairs.length,w=n-1+p.extra.length;g+=n*Math.max(1,C(w,3));if(n>=4)g+=n*C(n-1,3);});
  return g;}

  if(q.meta.fix&&seqLike(opts))opts.sort(function(a,b){return a.t<b.t?-1:a.t>b.t?1:0;});else opts=shuffle(opts,R);

function buildS(bl,sp){var pool=sPool(bl,sp.i),rows=pool.rows;if(rows.length<4)return null;var R=rng(sp.seed),k=sp.j,topic=pool.topic;
  var n=(k==="cb")?Math.min(5,rows.length):4;var idx=sample(rows.map(function(_,i){return i;}),n,R);

  if(k==="c"||k==="i"){var odd=Math.floor(R()*n);
    var sts=idx.map(function(ri,j){return stm(rows[ri],(k==="c")===(j===odd));});
    q.stem="Sobre “"+topic+"”, assinale a afirmativa "+(k==="c"?"CORRETA":"INCORRETA")+":";
    q.opts=shuffle(sts.map(function(s,j){return{t:s.text,ok:j===odd,s:s};}),R);
    q.res=q.opts.map(function(o){return{truth:o.s.truth,text:o.s.text,note:note(o.s)};});return q;}
  var tr;do{tr=idx.map(function(){return R()<0.5;});}while(!(tr.some(Boolean)&&tr.some(function(x){return!x;})));
  var sts2=idx.map(function(ri,j){return stm(rows[ri],tr[j]);});

  if(k==="vf"){q.stem="Sobre “"+topic+"”, julgue cada afirmativa como verdadeira (V) ou falsa (F) e marque a sequência correta, de cima para baixo:";
    var cor=tr.map(function(x){return x?"V":"F";}).join(", ");var seen={};seen[cor]=1;var o=[{t:cor,ok:true}];var guard=0;
    while(o.length<4&&guard++<60){var c=tr.slice();var flips=1+Math.floor(R()*2);for(var f=0;f<flips;f++){var p=Math.floor(R()*n);c[p]=!c[p];}
      var s=c.map(function(x){return x?"V":"F";}).join(", ");if(!seen[s]){seen[s]=1;o.push({t:s,ok:false});}}
    o.sort(function(a,b){return a.t<b.t?-1:1;});q.opts=o;return q;}
  q.stem="Sobre “"+topic+"”, analise as afirmativas abaixo. Estão corretas:";
  var set=[];tr.forEach(function(x,i){if(x)set.push(i);});var seen2={};var key=set.join();seen2[key]=1;var o2=[{t:subsetText(set),ok:true,set:set}];var g2=0;
  while(o2.length<4&&g2++<80){var cs=tr.slice();var fl=1+Math.floor(R()*2);for(var z=0;z<fl;z++){var pp=Math.floor(R()*n);cs[pp]=!cs[pp];}
    var st=[];cs.forEach(function(x,i){if(x)st.push(i);});if(!st.length)continue;var kk=st.join();if(seen2[kk])continue;seen2[kk]=1;o2.push({t:subsetText(st),ok:false,set:st});}
  o2.sort(function(a,b){return a.set.length-b.set.length||(a.set.join()<b.set.join()?-1:1);});q.opts=o2;return q;}
function buildP(bl,sp){var p=bl.P[sp.i];if(!p)return null;var R=rng(sp.seed);var pairs=p.pairs;if(pairs.length<2)return null;
  var pi=sp.j%pairs.length;var pr=pairs[pi];var k=pr[0],v=pr[1];

function buildF(bl,sp){var pool=bl.S[sp.i];if(!pool)return null;var r=pool.rows[sp.j];if(!r)return null;var R=rng(sp.seed);var truth=R()<0.5;var s=stm(r,truth);

  if(q.kind!=="mc"||st.answered||!st.ui||!st.ui.select)return;var k=e.key.toLowerCase();var idx=-1;
  if(q.vf1){if(k==="v"||k==="1")idx=0;else if(k==="f"||k==="2")idx=1;}else{if(/^[a-e]$/.test(k))idx=k.charCodeAt(0)-97;else if(/^[1-5]$/.test(k))idx=+k-1;}
  if(idx>=0&&idx<q.opts.length){st.ui.select(idx);e.preventDefault();}});

  $("#bTheme").onclick=function(){applyTheme(curTheme()==="dark"?"light":"dark",true);};$("#bFm").onclick=function(){applyFs(FS-1);};$("#bFp").onclick=function(){applyFs(FS+1);};})();
if(!getBlock(st.subj,st.bid)&&st.bid!=="mix")st.bid="mix";
if(!DB[st.subj])st.subj="anat";
nextQ();
window.__qz={DB:DB,st:st,build:build,genRandom:genRandom,buildS:buildS,buildP:buildP};
